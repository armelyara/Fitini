<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitini — Voice Analyzer</title>
<style>
:root{
  --fit-bg:#161819;--fit-surface:#1b1e1f;--fit-surface-2:#202425;--fit-surface-3:#0b0d0d;--fit-titlebar:#23282a;
  --fit-text:#b8c4c2;--fit-text-dim:#aeb9b7;--fit-text-muted:#78827f;--fit-text-faint:#4e5856;--fit-ink-on-green:#0b1a10;
  --fit-green:#38ef7d;--fit-green-solid:#44d66c;--fit-green-dim:#2a9a52;--fit-green-glow:rgba(56,239,125,.28);
  --fit-sage:#78a890;--fit-sage-dim:#4f6b5e;--fit-scanning:#d8b24a;--fit-alert:#e2574f;--fit-pending:#78827f;
  --fit-border:#2c3233;--fit-border-strong:#3a4243;--fit-grid-line:#242a2b;
  --mono:'Courier New',Consolas,'SF Mono',Menlo,Monaco,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0d0d;font-family:var(--mono);-webkit-font-smoothing:antialiased;height:100%}
a{color:var(--fit-green);text-decoration:none}
button{font-family:var(--mono)}
input{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#111314}
::-webkit-scrollbar-thumb{background:#2c3233}
::-webkit-scrollbar-thumb:hover{background:#3a4243}
@keyframes fit-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fit-stream{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fit-scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes fit-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fit-dash{to{stroke-dashoffset:-16}}
.stream{animation:fit-stream .3s ease}
</style>
</head>
<body>
<div id="root" style="position:relative;height:100vh;min-height:720px;background:var(--fit-bg);color:var(--fit-text);font-family:var(--mono);overflow:hidden"></div>

<script>
"use strict";
const C={green:"#38ef7d",sage:"#78a890",muted:"#78827f",alert:"#e2574f",scan:"#d8b24a",faint:"#4e5856",text:"#b8c4c2"};
const NAV=[
  {id:"standby",num:"01",label:"STANDBY"},
  {id:"intercept",num:"02",label:"INTERCEPT",live:true},
  {id:"report",num:"03",label:"REPORT"},
  {id:"dossier",num:"04",label:"DOSSIER"},
  {id:"archive",num:"05",label:"ARCHIVE"},
  {id:"upload",num:"06",label:"ANALYZE"},
  {id:"settings",num:"07",label:"CONFIG"},
];

const state={
  token:null, operatorId:"OP-7781 // VESPER", loginError:"",
  screen:"login", device:"desktop",
  started:false, done:false, streaming:false,
  lines:[], pending:[], anim:null, rows:Array.from({length:6},()=>["",""]),
  subject:"SEARCHING...", locations:[], idLocked:false, locationLocked:false, link:null,
  alertOpen:false, alert:null,
  sessions:[], query:"",
  report:null, reportId:null,
  dossier:null,
  uploadState:"idle", uploadPct:0, uploadFilename:"",
  settings:{vad:true,diarize:true,redact:false,autolock:true,language:"en",model_label:"faster-whisper · base.en",vad_threshold:0.62},
  clock:"--:--:-- UTC",
};
let ws=null, revealTimer=null;
const root=document.getElementById("root");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- API ---------------- */
async function api(path,opts={}){
  const headers=Object.assign({},opts.headers||{});
  if(state.token) headers["Authorization"]="Bearer "+state.token;
  if(opts.json){headers["Content-Type"]="application/json";opts.body=JSON.stringify(opts.json);delete opts.json;}
  const res=await fetch(path,Object.assign({},opts,{headers}));
  if(res.status===401){state.token=null;state.screen="login";render();throw new Error("unauthorized");}
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.status===204?null:res.json();
}

/* ---------------- clock ---------------- */
setInterval(()=>{
  const d=new Date();
  state.clock=d.toISOString().substr(11,8)+" UTC";
  const clk=document.getElementById("clock"); if(clk) clk.textContent=state.clock;
},1000);

/* ---------------- navigation ---------------- */
async function goto(screen){
  state.screen=screen;
  try{
    if(screen==="standby"||screen==="archive"){
      const r=await api("/api/sessions"); state.sessions=r.sessions;
    }else if(screen==="dossier"){
      state.dossier=await api("/api/targets/AMIRI");
    }else if(screen==="settings"){
      const r=await api("/api/settings"); state.settings=Object.assign({},state.settings,r.settings);
    }
  }catch(e){/* handled by api() */}
  render();
}

async function openSession(id){
  try{
    const s=await api("/api/sessions/"+encodeURIComponent(id));
    state.report=s.report; state.reportId=s.id; state.screen="report"; render();
  }catch(e){}
}

/* ---------------- auth ---------------- */
async function doLogin(){
  const op=document.getElementById("opId").value;
  const pass=document.getElementById("pass").value;
  try{
    const r=await api("/api/login",{method:"POST",json:{operator_id:op,passphrase:pass}});
    state.token=r.token; state.operatorId=r.operator_id||op; state.loginError="";
    try{const me=await api("/api/me"); state.settings=Object.assign({},state.settings,me.settings);}catch(e){}
    await goto("standby");
  }catch(e){
    state.loginError="ACCESS DENIED · CHECK CREDENTIALS"; render();
  }
}
function logout(){
  if(ws){try{ws.close();}catch(e){}ws=null;}
  api("/api/logout",{method:"POST"}).catch(()=>{});
  state.token=null; state.screen="login"; render();
}

/* ---------------- live intercept (WebSocket) ---------------- */
function startIntercept(){
  resetIntercept();
  state.started=true; state.streaming=true; render();
  const proto=location.protocol==="https:"?"wss:":"ws:";
  const url=`${proto}//${location.host}/ws/intercept?token=${encodeURIComponent(state.token||"")}`;
  ws=new WebSocket(url);
  ws.onmessage=ev=>{
    const msg=JSON.parse(ev.data);
    if(msg.type==="utterance") onUtterance(msg);
    else if(msg.type==="complete"){state.done=true;state.streaming=false;state.report=msg.report;state.reportId=msg.session_id;if(!state.anim&&state.pending.length===0)render();}
    else if(msg.type==="error"){state.streaming=false;if(!state.anim)render();}
  };
  ws.onclose=()=>{state.streaming=false;render();};
  ws.onerror=()=>{state.streaming=false;};
}
function resetIntercept(){
  if(ws){try{ws.close();}catch(e){}ws=null;}
  if(revealTimer){clearInterval(revealTimer);revealTimer=null;}
  state.started=false;state.done=false;state.streaming=false;
  state.lines=[];state.pending=[];state.anim=null;
  state.rows=Array.from({length:6},()=>["",""]);state.subject="SEARCHING...";
  state.locations=[];state.idLocked=false;state.locationLocked=false;state.link=null;
  state.alertOpen=false;state.alert=null;
}
// An utterance arrives -> queue it; the scan types it out word by word.
function onUtterance(msg){
  state.pending.push(msg);
  if(!state.anim) startReveal();
}
function startReveal(){
  if(revealTimer){clearInterval(revealTimer);revealTimer=null;}
  const msg=state.pending.shift();
  if(!msg){
    // Nothing left to type; if the session is done, surface the report state.
    if(state.done) render();
    return;
  }
  // Pre-compute each segment's character span within the line.
  let off=0;
  const spans=msg.segs.map(s=>{const o={start:off,end:off+s.text.length,seg:s,act:false};off+=s.text.length;return o;});
  state.anim={ts:msg.ts,segs:msg.segs,spans,reveal:0,len:off,state:msg.state,alert:msg.alert};
  renderTranscript();
  revealTimer=setInterval(stepReveal,28);
}
function stepReveal(){
  const a=state.anim; if(!a){clearInterval(revealTimer);revealTimer=null;return;}
  // Scan speeds up if transcription is arriving faster than we can type.
  a.reveal+=2+state.pending.length*3;
  let needFull=false;
  for(const sp of a.spans){
    if(sp.seg.kind!=="plain" && !sp.act && a.reveal>=sp.end){
      sp.act=true;                       // scan just finished this keyword -> flag it
      if(sp.seg.kind==="kw_lock"){
        state.rows[3][0]=sp.seg.canonical;              // fill the target cell...
        state.alert=a.alert||{code:sp.seg.canonical,detail:"Target asset relocation detected in live intercept.",confidence:0.9,window:"72:00:00"};
        state.alertOpen=true;                           // ...pop the threat...
        needFull=true;                                  // ...and draw the arrow to the box
      }
    }
  }
  if(a.reveal>=a.len){
    clearInterval(revealTimer);revealTimer=null;
    state.lines.push({ts:a.ts,segs:a.segs});
    const st=a.state;                                    // apply this utterance's cumulative state
    state.rows=st.rows;state.subject=st.subject;state.idLocked=st.id_locked;
    state.locations=st.locations;state.locationLocked=st.location_locked;
    state.anim=null;
    render();drawLink();
    startReveal();                                       // type the next queued line
    return;
  }
  if(needFull){render();drawLink();}
  else renderTranscript();
}
function renderTranscript(){
  const tp=document.getElementById("transcript");
  if(!tp){render();return;}
  tp.innerHTML=transcriptInner();
  tp.scrollTop=tp.scrollHeight;
}
function drawLink(){
  requestAnimationFrame(()=>{
    const marker=document.getElementById("fowl-marker");
    const cell=document.getElementById("cell-3-0");
    if(!marker||!cell){return;}
    const rb=root.getBoundingClientRect(),s=marker.getBoundingClientRect(),c=cell.getBoundingClientRect();
    state.link={x1:s.right-rb.left,y1:s.top-rb.top+s.height/2,x2:c.left-rb.left,y2:c.top-rb.top+c.height/2};
    const svg=document.getElementById("link-layer");
    if(svg){
      svg.style.display="block";
      const ln=document.getElementById("tactical-link");
      ln.setAttribute("x1",state.link.x1);ln.setAttribute("y1",state.link.y1);
      ln.setAttribute("x2",state.link.x2);ln.setAttribute("y2",state.link.y2);
    }
  });
}

/* ---------------- alert / threat ---------------- */
function simThreat(){
  state.alert={code:"FLYING FOWL",detail:"Target asset relocation detected in live intercept.",confidence:0.91,window:"72:00:00"};
  state.alertOpen=true; render();
}
function closeAlert(){state.alertOpen=false;render();}
function escalate(){state.alertOpen=false;goto("report");}

/* ---------------- settings ---------------- */
async function toggleSetting(key){
  state.settings[key]=!state.settings[key];
  render();
  try{await api("/api/settings",{method:"PUT",json:{settings:{[key]:state.settings[key]}}});}catch(e){}
}

/* ---------------- file analyze ---------------- */
function startUpload(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="audio/*,.wav,.mp3,.flac,.ogg";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    state.uploadFilename=f.name; state.uploadState="uploading"; state.uploadPct=10; render();
    const fd=new FormData(); fd.append("file",f);
    try{
      state.uploadPct=55; render();
      const r=await api("/api/analyze",{method:"POST",body:fd});
      state.uploadPct=100; state.uploadState="done"; state.report=r.report; state.reportId=r.session_id; render();
    }catch(e){state.uploadState="idle";state.uploadPct=0;render();}
  };
  inp.click();
}

/* ---------------- style helpers ---------------- */
function navBtnStyle(active){
  return `display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 18px;border:none;border-left:2px solid ${active?C.green:"transparent"};background:${active?"rgba(56,239,125,.07)":"transparent"};color:${active?C.green:C.text};font-family:var(--mono);font-size:12px;letter-spacing:.14em;cursor:pointer;${active?"text-shadow:0 0 8px var(--fit-green-glow);":""}`;
}
function devBtnStyle(active){
  return `font-size:10px;letter-spacing:.1em;padding:6px 11px;border:none;cursor:pointer;background:${active?C.green:"transparent"};color:${active?"#0b1a10":C.muted}`;
}
function chipStyle(kind){
  const map={subject:C.green,alias:C.sage,place:C.green,threat:C.alert,asset:C.scan};
  const col=map[kind]||C.sage;
  return `font-size:12px;letter-spacing:.08em;padding:7px 12px;border:1px solid ${col};color:${col};background:rgba(120,168,144,.05)`;
}
function toggleStyle(on){return `width:40px;height:20px;border:1px solid ${on?C.green:"#2c3233"};background:${on?"rgba(56,239,125,.15)":"#0b0d0d"};position:relative;cursor:pointer;padding:0`;}
function knobStyle(on){return `position:absolute;top:1px;left:${on?"21px":"1px"};width:16px;height:16px;background:${on?C.green:"#4e5856"};transition:left .15s,background .15s`;}
function cellStyle(active,hasVal){
  const base="padding:13px 12px;border-right:1px solid var(--fit-grid-line);border-bottom:1px solid var(--fit-grid-line);font-size:13px;letter-spacing:.06em;min-height:44px;display:flex;align-items:center;";
  if(active)return base+`background:repeating-linear-gradient(45deg,rgba(56,239,125,.06) 0,rgba(56,239,125,.06) 6px,transparent 6px,transparent 12px);border-left:2px solid ${C.green};color:${C.green};font-weight:700;box-shadow:inset 0 0 10px var(--fit-green-glow)`;
  return base+`color:${hasVal?C.green:C.faint}`;
}
const titlebar=t=>`<div style="background:var(--fit-titlebar);padding:7px 12px;font-size:12px;border-bottom:1px solid var(--fit-border);display:flex;justify-content:space-between"><span>${t}</span><span style="color:var(--fit-text-faint)">- □ x</span></div><div style="height:2px;background:linear-gradient(90deg,var(--fit-green),transparent)"></div>`;

/* ---------------- screens ---------------- */
function loginScreen(){
  return `<div style="position:absolute;inset:0;z-index:50;background:var(--fit-bg);display:grid;grid-template-rows:auto 1fr auto">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--fit-border);font-size:10px;letter-spacing:.28em;color:var(--fit-sage)"><span>SIGINT // OSINT — RESTRICTED</span><span>ACCESS TERMINAL · NODE CH.07</span></div>
    <div style="display:flex;align-items:center;justify-content:center">
      <div style="width:420px;max-width:90vw">
        <div style="font-size:44px;letter-spacing:.42em;color:var(--fit-green);text-shadow:0 0 14px var(--fit-green-glow);font-weight:700">FITINI</div>
        <div style="font-size:10px;letter-spacing:.3em;color:var(--fit-text-muted);margin:10px 0 36px">VOICE ANALYZER — AUTHENTICATION REQUIRED</div>
        <div style="border:1px solid var(--fit-border);background:var(--fit-surface)">
          ${titlebar("Secure Login")}
          <div style="padding:22px 20px;display:flex;flex-direction:column;gap:18px">
            <label style="display:block"><div style="font-size:11px;letter-spacing:.14em;color:var(--fit-text-muted);margin-bottom:7px">OPERATOR ID</div>
              <input id="opId" value="${esc(state.operatorId)}" style="width:100%;background:var(--fit-surface-3);border:1px solid var(--fit-border);color:var(--fit-green);font-size:14px;letter-spacing:.1em;padding:10px 12px;outline:none"/></label>
            <label style="display:block"><div style="font-size:11px;letter-spacing:.14em;color:var(--fit-text-muted);margin-bottom:7px">PASSPHRASE</div>
              <input id="pass" type="password" value="fitini" style="width:100%;background:var(--fit-surface-3);border:1px solid var(--fit-border);color:var(--fit-green);font-size:14px;letter-spacing:.3em;padding:10px 12px;outline:none"/></label>
            <div style="display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em;color:var(--fit-text-muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--fit-green);box-shadow:0 0 6px var(--fit-green-glow);animation:fit-pulse 1.6s infinite"></span>BIOMETRIC TOKEN · <span style="color:var(--fit-green)">PRESENT</span></div>
            ${state.loginError?`<div style="font-size:11px;letter-spacing:.1em;color:var(--fit-alert)">◆ ${esc(state.loginError)}</div>`:""}
            <button onclick="doLogin()" style="margin-top:4px;width:100%;font-size:13px;letter-spacing:.2em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:13px;cursor:pointer;box-shadow:0 0 10px var(--fit-green-glow)">▶ AUTHENTICATE</button>
          </div>
        </div>
        <div style="margin-top:16px;font-size:10px;letter-spacing:.12em;color:var(--fit-text-faint);line-height:1.8">CLEARANCE: TS/SCI · FAILED ATTEMPTS: 0/3<br>UNAUTHORIZED ACCESS IS A FEDERAL OFFENSE · DEMO — PASSPHRASE: fitini</div>
      </div>
    </div>
    <div style="padding:10px 24px;border-top:1px solid var(--fit-border);font-size:10px;letter-spacing:.2em;color:var(--fit-text-faint);display:flex;justify-content:space-between"><span>FITINI v2.4.1</span><span>© DIRECTORATE · ENCRYPTED SESSION</span></div>
  </div>`;
}

function statusInfo(){
  if(state.screen==="intercept"&&state.started&&!state.done) return {c:C.scan,l:"STREAM ACTIVE"};
  if(state.done) return {c:C.green,l:"INTERCEPT COMPLETE"};
  return {c:C.muted,l:"STANDBY"};
}
function topBar(){
  const st=statusInfo();
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 20px;border-bottom:1px solid var(--fit-border);background:var(--fit-surface-3)">
    <div style="display:flex;align-items:center;gap:18px"><span style="font-size:16px;letter-spacing:.34em;color:var(--fit-green);text-shadow:0 0 10px var(--fit-green-glow);font-weight:700">FITINI</span><span style="font-size:10px;letter-spacing:.24em;color:var(--fit-sage)">SIGINT // OSINT — RESTRICTED · CH.07</span></div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;color:${st.c}"><span style="width:8px;height:8px;border-radius:50%;background:${st.c};animation:fit-pulse 1.6s infinite"></span>${st.l}</span>
      <span id="clock" style="font-size:11px;color:var(--fit-text-muted);letter-spacing:.1em">${esc(state.clock)}</span>
      <div style="display:flex;border:1px solid var(--fit-border)"><button onclick="state.device='desktop';render()" style="${devBtnStyle(state.device==='desktop')}">DESKTOP</button><button onclick="state.device='tablet';render()" style="${devBtnStyle(state.device==='tablet')}">TABLET</button></div>
      <button onclick="simThreat()" title="simulate threat" style="font-size:10px;letter-spacing:.12em;color:var(--fit-alert);background:transparent;border:1px solid var(--fit-alert);padding:6px 10px;cursor:pointer">◆ SIM THREAT</button>
      <button onclick="logout()" style="font-size:10px;letter-spacing:.12em;color:var(--fit-text-muted);background:transparent;border:1px solid var(--fit-border);padding:6px 10px;cursor:pointer">⏻ LOCK</button>
    </div>
  </div>`;
}
function navRail(){
  const items=NAV.map(n=>{
    const active=state.screen===n.id;
    const badge=(n.live&&state.screen==="intercept"&&state.started&&!state.done)?`<span style="margin-left:auto;font-size:9px;letter-spacing:.1em;color:var(--fit-green)">●</span>`:"";
    return `<button onclick="goto('${n.id}')" style="${navBtnStyle(active)}"><span style="color:var(--fit-text-faint);font-size:10px">${n.num}</span><span>${n.label}</span>${badge}</button>`;
  }).join("");
  return `<nav style="width:208px;border-right:1px solid var(--fit-border);background:var(--fit-surface-3);display:flex;flex-direction:column;padding:16px 0;min-height:0">
    <div style="font-size:10px;letter-spacing:.24em;color:var(--fit-text-faint);padding:0 18px 12px">NAVIGATION</div>${items}
    <div style="margin-top:auto;padding:14px 18px;border-top:1px solid var(--fit-border);font-size:10px;letter-spacing:.1em;color:var(--fit-text-faint);line-height:1.7">OPERATOR<br><span style="color:var(--fit-sage)">${esc(state.operatorId)}</span><br>SESSION ENCRYPTED</div>
  </nav>`;
}
const dashCols=()=>state.device==="tablet"?"1fr":"1.35fr 1fr";

function standbyScreen(){
  const recent=state.sessions.slice(0,4).map(a=>`<button onclick="openSession('${esc(a.id)}')" style="width:100%;text-align:left;display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:10px 16px;border:none;border-bottom:1px solid var(--fit-grid-line);background:transparent;color:var(--fit-text);font-size:11px;cursor:pointer"><span style="color:var(--fit-sage)">${esc(a.id)}</span><span style="color:var(--fit-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.subject)}</span><span style="color:${a.statusColor}">${esc(a.status)}</span></button>`).join("");
  return `<div style="padding:28px 36px;display:grid;grid-template-columns:${dashCols()};gap:22px;min-height:100%">
    <div style="border:1px solid var(--fit-border);background:var(--fit-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(var(--fit-green-glow),transparent);opacity:.15;animation:fit-scan 4s linear infinite"></div>
      <div style="font-size:11px;letter-spacing:.3em;color:var(--fit-sage);margin-bottom:22px">AUDIO INTERCEPT · AWAITING SIGNAL</div>
      <div style="font-size:64px;letter-spacing:.3em;color:var(--fit-text-faint);margin-bottom:8px">▌</div>
      <div style="font-size:13px;letter-spacing:.16em;color:var(--fit-text-muted);margin-bottom:34px">NO ACTIVE STREAM</div>
      <button onclick="goto('intercept')" style="font-size:14px;letter-spacing:.2em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:14px 32px;cursor:pointer;box-shadow:0 0 12px var(--fit-green-glow)">▶ INITIATE INTERCEPT</button>
      <button onclick="goto('upload')" style="margin-top:14px;font-size:11px;letter-spacing:.14em;color:var(--fit-sage);background:transparent;border:1px solid var(--fit-border);padding:9px 20px;cursor:pointer">⤒ ANALYZE RECORDED FILE</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">

/* --- streaming transcript renderers --- */
function segSpan(s,revealed,mb){
  if(s.kind==="plain") return `<span>${esc(s.text)}</span>`;
  if(!revealed) return `<span style="color:var(--fit-text-dim)">${esc(s.text)}</span>`;
  if(s.kind==="kw_lock"){
    let id=""; if(mb.allow){id=' id="fowl-marker"';mb.allow=false;}
    return `<span${id} style="background:var(--fit-green-solid);color:var(--fit-ink-on-green);padding:1px 5px;font-weight:700;box-shadow:0 0 8px var(--fit-green-glow)">${esc(s.text)}</span>`;
  }
  return `<span style="color:var(--fit-green);background:rgba(56,239,125,.08);padding:1px 4px;font-weight:700">${esc(s.text)}</span>`;
}
function lineDiv(ts,inner){
  return `<div class="stream" style="font-size:16px;line-height:1.45;letter-spacing:.03em;color:var(--fit-text-dim)"><span style="color:var(--fit-text-faint);font-size:11px;margin-right:10px">${esc(ts||"")}</span>${inner}</div>`;
}
function animLineHtml(markAnim){
  const a=state.anim,mb={allow:!!markAnim};let out="";
  for(let i=0;i<a.spans.length;i++){
    const sp=a.spans[i],s=sp.seg;
    if(a.reveal<=sp.start) break;
    if(a.reveal>=sp.end){ out+=segSpan(s,true,mb); }
    else { out+=`<span style="color:var(--fit-text-dim)">${esc(s.text.slice(0,a.reveal-sp.start))}</span>`; break; }
  }
  const cursor=a.reveal<a.len?`<span style="color:var(--fit-sage);animation:fit-blink 1s step-end infinite">▌</span>`:"";
  return lineDiv(a.ts,out+cursor);
}
function transcriptInner(){
  const header=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;letter-spacing:.2em;color:var(--fit-sage)">LIVE TRANSCRIPT · CH.07</span><span style="font-size:10px;color:var(--fit-text-faint)">${state.lines.length}${state.anim?"+1":""}</span></div>`;
  if(!state.started){
    return header+`<div style="margin:auto;text-align:center;padding:60px 0"><div style="font-size:10px;letter-spacing:.28em;color:var(--fit-sage);margin-bottom:18px">AWAITING SIGNAL</div><button onclick="startIntercept()" style="font-size:13px;letter-spacing:.14em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:11px 22px;cursor:pointer;box-shadow:0 0 10px var(--fit-green-glow)">▶ INITIATE INTERCEPT</button></div>`;
  }
  // Only ONE element may carry id="fowl-marker": prefer the scanning line's revealed lock,
  // else the most recent completed lock.
  const animLock=state.anim&&state.anim.spans.some(sp=>sp.seg.kind==="kw_lock"&&state.anim.reveal>=sp.end);
  let markLineIdx=-1;
  if(!animLock){ for(let i=state.lines.length-1;i>=0;i--){ if(state.lines[i].segs.some(s=>s.kind==="kw_lock")){markLineIdx=i;break;} } }
  let html=header;
  state.lines.forEach((ln,i)=>{
    const mb={allow:i===markLineIdx};
    html+=lineDiv(ln.ts,ln.segs.map(s=>segSpan(s,true,mb)).join(""));
  });
  if(state.anim) html+=animLineHtml(animLock);
  if(state.streaming&&!state.anim) html+=`<div style="color:var(--fit-sage);font-size:16px;letter-spacing:.03em">▌<span style="opacity:.6"> listening…</span></div>`;
  return html;
}

function settingsScreen(){
  const s=state.settings;
  const toggleRow=(key,label,hint)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--fit-grid-line);font-size:13px"><div><div style="color:var(--fit-text)">${label}</div><div style="color:var(--fit-text-faint);font-size:10px;margin-top:3px">${hint}</div></div><button onclick="toggleSetting('${key}')" style="${toggleStyle(!!s[key])}"><span style="${knobStyle(!!s[key])}"></span></button></div>`;
  const valueRow=(label,hint,val)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--fit-grid-line);font-size:13px"><div><div style="color:var(--fit-text)">${label}</div><div style="color:var(--fit-text-faint);font-size:10px;margin-top:3px">${hint}</div></div><span style="color:var(--fit-green);letter-spacing:.08em">${esc(val)}</span></div>`;
  const group=(title,inner)=>`<div style="border:1px solid var(--fit-border);background:var(--fit-surface);margin-bottom:18px">${titlebar(title)}<div style="padding:6px 16px">${inner}</div></div>`;
  return `<div style="padding:28px 36px;max-width:720px">
    <div style="font-size:22px;letter-spacing:.1em;color:var(--fit-text);margin-bottom:22px">SOURCE CONFIGURATION</div>
    ${group("Audio Source",valueRow("Input device","Capture interface","LIVE MIC · 48kHz")+valueRow("Sample window","VAD segment length","1.1s")+toggleRow("vad","Silero VAD","Voice-activity gating · THR "+esc(s.vad_threshold)))}
    ${group("Transcription",valueRow("Model","faster-whisper",esc(s.model_label))+toggleRow("diarize","Speaker diarization","Separate multi-speaker channels")+valueRow("Language","Primary decode",esc((s.language||"en").toUpperCase())+" · auto"))}
    ${group("Intel Engine",valueRow("NER model","spaCy pipeline","en_core_web_trf")+toggleRow("autolock","Auto-lock targets","Lock subjects/locations on correlation")+toggleRow("redact","Redact PII","Mask non-tactical identifiers (cash, jewellery)"))}
    <div style="font-size:10px;letter-spacing:.1em;color:var(--fit-text-faint);line-height:1.7">Toggles persist server-side and apply to the next intercept. AUTO-LOCK off → subject stays unlocked. REDACT on → flagged terms masked in the live transcript.</div>
  </div>`;
}

function alertModal(){
  if(!state.alertOpen||!state.alert) return "";
  const a=state.alert;
  return `<div style="position:absolute;inset:0;z-index:70;background:rgba(11,13,13,.82);display:flex;align-items:center;justify-content:center">
    <div style="width:460px;max-width:92vw;border:1px solid var(--fit-alert);background:var(--fit-surface);box-shadow:0 0 26px rgba(226,87,79,.3)">
      <div style="background:#2a1a1a;border-bottom:1px solid var(--fit-alert);padding:9px 14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;letter-spacing:.16em;color:var(--fit-alert)">◆ THREAT DETECTED</span><button onclick="closeAlert()" style="background:transparent;border:none;color:var(--fit-text-faint);cursor:pointer;font-size:13px">x</button></div>
      <div style="height:2px;background:var(--fit-alert);animation:fit-pulse 1s infinite"></div>
      <div style="padding:22px 20px">
        <div style="font-size:10px;letter-spacing:.2em;color:var(--fit-text-muted);margin-bottom:8px">CLASS · ASSET MOVEMENT</div>
        <div style="font-size:26px;letter-spacing:.08em;color:var(--fit-alert);font-weight:700;margin-bottom:6px">${esc(a.code)}</div>
        <div style="font-size:13px;color:var(--fit-text-dim);line-height:1.5;margin-bottom:18px">${esc(a.detail)} Deadline entity <span style="color:var(--fit-green)">72 HOURS</span> correlated to subject <span style="color:var(--fit-green)">${esc(state.subject)}</span>.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px"><div style="border:1px solid var(--fit-border);padding:12px 14px"><div style="font-size:10px;letter-spacing:.14em;color:var(--fit-text-muted);margin-bottom:6px">CONFIDENCE</div><div style="font-size:20px;color:var(--fit-alert)">${esc(a.confidence)}</div></div><div style="border:1px solid var(--fit-border);padding:12px 14px"><div style="font-size:10px;letter-spacing:.14em;color:var(--fit-text-muted);margin-bottom:6px">WINDOW</div><div style="font-size:20px;color:var(--fit-scanning)">${esc(a.window)}</div></div></div>
        <div style="display:flex;gap:10px"><button onclick="closeAlert()" style="flex:1;font-size:12px;letter-spacing:.14em;color:var(--fit-text-muted);background:transparent;border:1px solid var(--fit-border);padding:12px;cursor:pointer">ACKNOWLEDGE</button><button onclick="escalate()" style="flex:1;font-size:12px;letter-spacing:.14em;color:#fff;background:var(--fit-alert);border:none;padding:12px;cursor:pointer">◆ ESCALATE NOW</button></div>
      </div>
    </div>
  </div>`;
}

/* ---------------- render ---------------- */
function mainContent(){
  switch(state.screen){
    case "standby": return standbyScreen();
    case "intercept": return interceptScreen();
    case "report": return reportScreen();
    case "dossier": return dossierScreen();
    case "archive": return archiveScreen();
    case "upload": return uploadScreen();
    case "settings": return settingsScreen();
    default: return standbyScreen();
  }
}
function render(){
  if(state.screen==="login"){root.innerHTML=loginScreen();return;}
  root.innerHTML=`<div style="display:grid;grid-template-rows:auto 1fr;height:100%">
    ${topBar()}
    <div style="display:grid;grid-template-columns:auto 1fr;min-height:0">
      ${navRail()}
      <main style="min-height:0;min-width:0;overflow:auto;position:relative">${mainContent()}</main>
    </div>
  </div>${alertModal()}`;
  if(state.screen==="intercept"&&state.link) drawLink();
}

render();
</script>
</body>
</html>
