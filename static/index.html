<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitini — Poste d'analyse</title>
<style>
:root{
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fit-green:#38ef7d; --fit-green-solid:#5cff98; --fit-green-dim:#1f7a46; --fit-green-glow:rgba(56,239,125,.35);
  --fit-ink-on-green:#07140c; --fit-sage:#78a890; --fit-scanning:#d8b24a; --fit-alert:#e2574f;
  --fit-bg:#0b0d0d; --fit-surface:#111516; --fit-surface-2:#151a1b; --fit-surface-3:#0e1213;
  --fit-titlebar:#141a1b; --fit-border:#242b2c; --fit-border-strong:#394244; --fit-grid-line:#1b2122;
  --fit-text:#d6e2df; --fit-text-dim:#aebbb8; --fit-text-muted:#7d8c89; --fit-text-faint:#55615f;
  --cat-person:#38ef7d; --cat-place:#78a890; --cat-org:#d8b24a; --cat-threat:#e2574f; --cat-date:#5fcede; --cat-asset:#bfa6ea;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fit-bg);color:var(--fit-text);font-family:var(--mono);-webkit-font-smoothing:antialiased}
#app{height:100%}
a{color:var(--fit-green);text-decoration:none}
button{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#111314}::-webkit-scrollbar-thumb{background:#2c3233}
input{font-family:var(--mono)}
@keyframes fit-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fit-stream{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fit-scan{from{transform:translateY(-100%)}to{transform:translateY(120%)}}
@keyframes fit-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fit-flash{0%{box-shadow:0 0 0 rgba(56,239,125,0)}35%{box-shadow:0 0 18px var(--fit-green-glow)}100%{box-shadow:0 0 6px var(--fit-green-glow)}}
.kw-flash{animation:fit-flash .5s ease-out}
.cell-hot{box-shadow:0 0 14px var(--fit-green-glow)!important;border-color:var(--fit-green)!important;transition:box-shadow .2s,border-color .2s}
.ent{border-bottom:2px solid currentColor;padding:0 1px;font-weight:700;cursor:pointer;transition:opacity .15s}
.ent.dim{opacity:.28}
.win{border:1px solid var(--fit-border);background:var(--fit-surface)}
.win-h{background:var(--fit-titlebar);border-bottom:1px solid var(--fit-border);padding:7px 12px;font-size:12px;letter-spacing:.04em}
.win-r{height:2px;background:linear-gradient(90deg,var(--fit-green),transparent)}
.primary{font-size:12px;letter-spacing:.14em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:11px 20px;cursor:pointer;box-shadow:0 0 10px var(--fit-green-glow)}
.ghost{font-size:11px;letter-spacing:.12em;color:var(--fit-sage);background:transparent;border:1px solid var(--fit-border);padding:7px 12px;cursor:pointer}
.cellbox{border:1px solid var(--fit-border);background:var(--fit-surface-3);min-height:42px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.06em;color:var(--fit-green)}
.cellbox.empty{color:var(--fit-text-faint)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL_CAT={PERSON:"person",SUBJECT:"person",ALIAS:"person",LOCATION:"place",PLACE:"place",COORD:"place",
  ORG:"org",SECTOR:"org",CODEWORD:"threat",ACTOR:"threat",THREAT:"threat",CVE:"threat",APT:"threat",MALWARE:"threat",
  DEADLINE:"date",PHONE:"date",DATE:"date",ASSET:"asset",DRUG:"asset",ADR:"threat",GENE:"person"};
const FLAG_LABELS=new Set(["CODEWORD","ASSET","DEADLINE","COORD","PHONE","CVE","APT","MALWARE","ADR"]);
const catOf=(label)=>LABEL_CAT[(label||"").toUpperCase()]||"org";
const catColor=(cat)=>`var(--cat-${cat})`;

const DOMAINS=[
  {id:"justice",name:"Justice / e-Discovery",desc:"Pièces, correspondances, dépositions."},
  {id:"osint",name:"Réseaux sociaux (OSINT)",desc:"Comptes, pseudonymes, lieux, résolution d'alias."},
  {id:"cti",name:"Cybersécurité (CTI)",desc:"Acteurs, IOC, infrastructures, campagnes."},
  {id:"pharma",name:"Biomédical / Pharmacovigilance",desc:"Substances, effets indésirables, signaux."},
];
const CMDS=[
  {cmd:"chrono",desc:"chronologie des faits"},
  {cmd:"graphe",desc:"graphe de relations"},
  {cmd:"flags",desc:"anomalies détectées"},
  {cmd:"cross A B",desc:"croiser deux entités"},
  {cmd:"link <entité>",desc:"relations d'une entité"},
  {cmd:"find <mot>",desc:"recherche plein-texte"},
  {cmd:"help · clear",desc:"guide · effacer"},
];

const S={
  screen:"selection", token:localStorage.getItem("fitini_tok")||null, opId:"OP-7781 // VESPER",
  domains:new Set(), clock:"--:--:-- UTC",
  // flux / engine state
  started:false, done:false, streaming:false,
  lines:[], frames:[], detectedOrder:[], rows:emptyRows(), cellOf:{}, pairOf:{},
  summary:{locked:null,leading:null,entities:[]}, relationships:[], hypotheses:[], timeline:[], flags:[],
  hotCanon:null, arrow:null, busyFlags:false, flagQueue:[],
  // report interactions
  results:[], filterEnt:null, pulse:null,
  // terminal
  termOpen:false, termLines:[{t:"Fitini · terminal déterministe — tapez `help`.",c:"var(--fit-sage)"}],
  // modals / misc
  crossOpen:false, crossA:"", crossB:"", query:"", archive:[], settings:{vad:true,diarize:true,redact:false,autolock:true},
};
let ws=null;
function emptyRows(){return [["",""],["",""],["",""],["",""],["",""],["",""]];}

/* ---------------- api ---------------- */
async function api(path,opts={}){
  const h=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(S.token) h["Authorization"]="Bearer "+S.token;
  const r=await fetch(path,Object.assign({},opts,{headers:h,body:opts.json?JSON.stringify(opts.json):opts.body}));
  if(!r.ok) throw new Error("HTTP "+r.status);
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}

/* ---------------- clock ---------------- */
setInterval(()=>{ const d=new Date(),p=n=>String(n).padStart(2,"0");
  S.clock=p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds())+" UTC";
  const c=$("clock"); if(c)c.textContent=S.clock; },1000);

/* ================= RENDER ================= */
function render(){
  const app=$("app");
  if(S.screen==="selection"){ app.innerHTML=viewSelection(); return; }
  app.innerHTML=viewShell(viewContent());
  if(S.screen==="intercept") afterInterceptMount();
}

/* ---- selection (mandatory entry) ---- */
function viewSelection(){
  const cards=DOMAINS.map(d=>{
    const on=S.domains.has(d.id);
    return `<button onclick="fitini.toggleDomain('${d.id}')" style="text-align:left;display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid ${on?"var(--fit-green)":"var(--fit-border-strong)"};background:${on?"rgba(56,239,125,.07)":"var(--fit-surface)"};cursor:pointer;width:100%">
      <span style="flex:none;margin-top:2px;width:16px;height:16px;border:1px solid ${on?"var(--fit-green)":"var(--fit-border-strong)"};background:${on?"radial-gradient(circle,var(--fit-green) 0 42%,transparent 46%)":"transparent"};box-shadow:${on?"0 0 8px var(--fit-green-glow)":"none"}"></span>
      <span><span style="display:block;font-size:13px;letter-spacing:.06em;color:var(--fit-text);font-weight:700">${esc(d.name)}</span>
      <span style="display:block;font-size:11px;color:var(--fit-text-muted);line-height:1.5;margin-top:4px">${esc(d.desc)}</span></span></button>`;
  }).join("");
  const n=S.domains.size;
  return `<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 16px">
    <div style="width:100%;max-width:560px">
      <div style="font-size:20px;letter-spacing:.34em;color:var(--fit-green);text-shadow:0 0 10px var(--fit-green-glow);font-weight:700;margin-bottom:6px">FITINI</div>
      <div style="font-size:11px;letter-spacing:.2em;color:var(--fit-sage);margin-bottom:22px">POSTE D'ANALYSE · HORS-LIGNE · DÉTERMINISTE</div>
      <div style="font-size:12px;letter-spacing:.14em;color:var(--fit-text-faint);margin-bottom:12px">SÉLECTIONNER LE(S) DOMAINE(S) D'INVESTIGATION</div>
      <div style="display:flex;flex-direction:column;gap:10px">${cards}</div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:22px">
        <button onclick="fitini.enter()" ${n?"":"disabled"} style="${n?"":"opacity:.4;cursor:not-allowed;"}font-size:12px;letter-spacing:.14em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:12px 22px;cursor:pointer;box-shadow:0 0 10px var(--fit-green-glow)">DÉMARRER L'ANALYSE →</button>
        <span style="font-size:11px;color:var(--fit-text-muted)">${n} domaine(s) · le moteur se positionne sur la sélection</span>
      </div>
    </div></div>`;
}

/* ---- shell: top bar + nav + content + terminal ---- */
function viewShell(content){
  const navItems=[["intercept","01 INTERCEPT"],["report","02 REPORT"],["dossier","03 DOSSIER"],["archive","04 ARCHIVE"],["analyze","05 ANALYZE"],["config","06 CONFIG"]];
  const nav=navItems.map(([k,l])=>{const a=S.screen===k;
    return `<button onclick="fitini.go('${k}')" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 18px;border:none;border-left:2px solid ${a?"var(--fit-green)":"transparent"};background:${a?"rgba(56,239,125,.07)":"transparent"};color:${a?"var(--fit-green)":"var(--fit-text)"};font-size:12px;letter-spacing:.14em;cursor:pointer">${esc(l)}${(k==="intercept"&&S.started&&!S.done)?' <span style="margin-left:auto;color:var(--fit-green)">●</span>':""}</button>`;
  }).join("");
  const sel=[...S.domains].join(" · ").toUpperCase();
  return `<div style="display:grid;grid-template-rows:auto 1fr;height:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 20px;border-bottom:1px solid var(--fit-border);background:var(--fit-surface-3);flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:16px">
        <span style="font-size:16px;letter-spacing:.34em;color:var(--fit-green);text-shadow:0 0 10px var(--fit-green-glow);font-weight:700">FITINI</span>
        <span style="font-size:10px;letter-spacing:.2em;color:var(--fit-sage)">POSTE D'ANALYSE · RESTRICTED · CH.07</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span id="clock" style="font-size:11px;color:var(--fit-text-muted);letter-spacing:.1em">${esc(S.clock)}</span>
        <span style="font-size:10px;letter-spacing:.12em;color:var(--fit-sage);border:1px solid var(--fit-green-dim);padding:6px 10px">⌗ ${esc(sel||"—")}</span>
        <button onclick="fitini.toggleTerm()" style="font-size:10px;letter-spacing:.12em;color:${S.termOpen?"var(--fit-ink-on-green)":"var(--fit-green)"};background:${S.termOpen?"var(--fit-green)":"transparent"};border:1px solid var(--fit-green-dim);padding:6px 10px;cursor:pointer">▌ TERMINAL</button>
        <button onclick="fitini.lock()" style="font-size:10px;letter-spacing:.12em;color:var(--fit-text-muted);background:transparent;border:1px solid var(--fit-border);padding:6px 10px;cursor:pointer">⏻ VERROU</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:auto 1fr;min-height:0">
      <nav style="width:208px;border-right:1px solid var(--fit-border);background:var(--fit-surface-3);display:flex;flex-direction:column;padding:16px 0;min-height:0">
        <div style="font-size:10px;letter-spacing:.24em;color:var(--fit-text-faint);padding:0 18px 12px">NAVIGATION</div>
        ${nav}
        <div style="margin-top:auto;padding:14px 18px;border-top:1px solid var(--fit-border);font-size:10px;letter-spacing:.1em;color:var(--fit-text-faint);line-height:1.7">OPÉRATEUR<br><span style="color:var(--fit-sage)">${esc(S.opId)}</span><br>HORS-LIGNE · DÉTERMINISTE</div>
      </nav>
      <main style="min-height:0;min-width:0;overflow:auto;position:relative">${content}</main>
    </div>
    ${viewTerminal()}
    ${S.crossOpen?viewCross():""}
  </div>`;
}

function viewContent(){
  switch(S.screen){
    case "intercept": return viewIntercept();
    case "report": return viewReport();
    case "dossier": return viewDossier();
    case "archive": return viewArchive();
    case "analyze": return viewAnalyze();
    case "config": return viewConfig();
    default: return "";
  }
}

/* ---- INTERCEPT (flux) ---- */
function viewIntercept(){
  return `<div id="ingest" style="position:relative;min-height:100%;padding:22px 28px">
    <svg id="arrow-layer" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:visible"></svg>
    <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:0">
      <div id="transcol" style="padding-right:28px;border-right:1px solid var(--fit-border);display:flex;flex-direction:column;gap:11px;min-height:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;letter-spacing:.2em;color:var(--fit-sage)">TRANSCRIPTION EN DIRECT · CH.07</span>
          <span id="lc" style="font-size:10px;color:var(--fit-text-faint)"></span>
        </div>
        <div id="transcript" style="display:flex;flex-direction:column;gap:11px"></div>
        <div id="flux-cta"></div>
      </div>
      <div style="padding-left:24px;display:flex;flex-direction:column;gap:16px">
        <div class="win"><div class="win-h">Matrice de corrélation</div><div class="win-r"></div>
          <div id="matrix" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px"></div></div>
        <div class="win"><div class="win-h">Résumé</div><div class="win-r"></div>
          <div id="summary" style="padding:13px 16px;display:flex;flex-direction:column;gap:9px;font-size:13px"></div></div>
        <div class="win"><div class="win-h">Analyseur</div><div class="win-r"></div>
          <div id="analyzer" style="padding:13px 16px;display:flex;justify-content:space-between;align-items:center"></div></div>
      </div>
    </div></div>`;
}
function afterInterceptMount(){
  renderMatrix(); renderSummary(); renderAnalyzer(); renderTranscript(); renderFluxCta();
  // redraw existing lines (e.g., when returning to screen)
}
function renderFluxCta(){
  const el=$("flux-cta"); if(!el)return;
  if(!S.started){ el.innerHTML=`<div style="margin:30px auto;text-align:center"><div style="font-size:10px;letter-spacing:.28em;color:var(--fit-sage);margin-bottom:16px">EN ATTENTE DU SIGNAL</div><button class="primary" onclick="fitini.startFlux()">▶ LANCER LE FLUX</button></div>`; }
  else if(S.streaming){ el.innerHTML=`<div style="color:var(--fit-sage);font-size:15px">▌<span style="animation:fit-blink 1s infinite"> écoute…</span></div>`; }
  else el.innerHTML="";
}
function renderTranscript(){
  const el=$("transcript"); if(!el)return;
  el.innerHTML=S.lines.map(ln=>lineHtml(ln)).join("");
  const lc=$("lc"); if(lc)lc.textContent=S.lines.length+(S.totalLines?("/"+S.totalLines):"");
  el.scrollTop=el.scrollHeight;
}
function lineHtml(ln){
  const spk=ln.speaker||"";
  const segs=ln.segs.map(s=>{
    if(!s.label) return `<span>${esc(s.text)}</span>`;
    const cat=catOf(s.label); const dim=S.filterEnt&&S.filterEnt!==s.canonical?" dim":"";
    return `<span class="ent${dim}" data-ent="${esc(s.canonical||"")}" onclick="fitini.focus('${esc(s.canonical||"")}')" style="color:${catColor(cat)}">${esc(s.text)}</span>`;
  }).join("");
  return `<div style="animation:fit-stream .3s var(--ease);display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:baseline">
    <span style="color:var(--fit-text-faint);font-size:11px">${esc(ln.ts||"")}</span>
    <div style="font-size:15px;line-height:1.5;color:var(--fit-text-dim)">${segs}</div></div>`;
}
function renderMatrix(){
  const el=$("matrix"); if(!el)return;
  let html="";
  for(let r=0;r<6;r++)for(let c=0;c<2;c++){
    const v=S.rows[r][c]; const hot=c===0&&v&&v===S.hotCanon;
    html+=`<div id="cell-${r}-${c}" class="cellbox${v?"":" empty"}${hot?" cell-hot":""}">${esc(v||"—")}</div>`;
  }
  el.innerHTML=html;
}
function renderSummary(){
  const el=$("summary"); if(!el)return;
  const locked=S.summary.locked; const subj=S.summary.entities.includes("AMIRI")?"AMIRI":(S.summary.entities[0]||"SEARCHING...");
  const row=(k,v,col)=>`<div style="display:flex;justify-content:space-between"><span style="color:var(--fit-text-muted)">${k}</span><span style="color:${col||"var(--fit-text)"};font-weight:700;letter-spacing:.05em">${esc(v)}</span></div>`;
  el.innerHTML=row("Sujet :",subj,locked?"var(--fit-green)":"var(--fit-text-muted)")
    +row("Algorithme :","Mots-clés")
    +row("Entités :",String(S.summary.entities.length),"var(--fit-green)")
    +row("Lock :",locked?"VERROUILLÉ":"—",locked?"var(--fit-green)":"var(--fit-text-muted)");
}
function renderAnalyzer(){
  const el=$("analyzer"); if(!el)return;
  const col=S.done?"var(--fit-green)":S.started?"var(--fit-scanning)":"var(--fit-text-muted)";
  const lab=S.done?"INTERCEPT COMPLETE":S.started?"STREAM ACTIVE":"IDLE";
  el.innerHTML=`<span style="display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:${col}"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${lab}</span>`
    +(S.done?`<button class="ghost" onclick="fitini.go('report')">REPORT →</button>`:S.streaming?`<span style="font-size:10px;color:var(--fit-scanning);animation:fit-pulse 1.4s infinite">● REC</span>`:"");
}

/* ---- REPORT (workspace) ---- */
function viewReport(){
  const actions=[["Chronologie","chrono"],["Graphe","graphe"],["Flags","flags"],["Croiser","cross"],[S.filterEnt?"Retirer le filtre":"Filtrer","filter"]]
    .map(([l,a])=>`<button onclick="fitini.action('${a}')" style="font-size:11px;letter-spacing:.1em;color:var(--fit-text);background:var(--fit-surface);border:1px solid var(--fit-border);padding:9px 14px;cursor:pointer">${esc(l)}</button>`).join("");
  const wsLines=S.lines.length?S.lines.map(ln=>lineHtml(ln)).join(""):`<div style="color:var(--fit-text-faint);font-size:12px">Aucun flux analysé. Lancez un INTERCEPT ou un ANALYZE.</div>`;
  const results=S.results.map(r=>`<div style="border:1px solid var(--fit-border);border-left:2px solid var(--fit-green);background:var(--fit-surface-2);padding:10px 12px;animation:fit-flash .6s ease">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fit-green);font-weight:700">${esc(r.title)}</span><button onclick="fitini.dropResult(${r.id})" style="background:none;border:none;color:var(--fit-text-faint);cursor:pointer">✕</button></div>
      <div style="font-size:12px;color:var(--fit-text-dim);margin:6px 0 8px;line-height:1.5">${esc(r.body)}</div>
      <div style="font-size:10px;color:var(--fit-text-faint);border-top:1px dashed var(--fit-border);padding-top:7px"><span style="color:var(--fit-sage)">SOURCES ▸</span> ${esc(r.sources)}</div></div>`).join("");
  const hyp=(S.hypotheses.length?S.hypotheses:[]).slice(0,4).map(h=>{
    const pct=Math.round((h.confidence||0)*100); const col=catColor(catOf(h.code||"ORG"));
    const pres=(h.present||[]).join(" · ")||"—";
    return `<div style="border:1px solid var(--fit-border);background:var(--fit-surface-2);padding:11px 12px">
      <div style="font-size:12px;color:var(--fit-text);line-height:1.45;margin-bottom:9px">${esc(h.name)}</div>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><span style="font-size:9px;color:var(--fit-text-faint)">CONFIANCE</span>
        <div style="flex:1;height:5px;background:var(--fit-surface-3);border:1px solid var(--fit-border)"><div style="height:100%;width:${pct}%;background:${col}"></div></div>
        <span style="font-size:11px;color:${col};font-weight:700">${(h.confidence||0).toFixed(2)}</span></div>
      <div style="font-size:10px;color:var(--fit-text-faint);border-top:1px dashed var(--fit-border);padding-top:7px"><span style="color:var(--fit-sage)">CRITÈRES ▸</span> ${esc(pres)}</div></div>`;
  }).join("")||`<div style="color:var(--fit-text-faint);font-size:12px">—</div>`;
  const tl=S.timeline.filter(e=>e.kind!=="lead").slice(0,12).map(t=>`<div style="display:grid;grid-template-columns:52px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--fit-grid-line)">
      <span style="color:var(--fit-sage);font-size:12px">${esc(t.t||"")}</span>
      <div><div style="font-size:12px;color:var(--fit-text-dim);line-height:1.45">${esc(t.text)}${t.detail?` <span style="color:var(--fit-text-faint)">(${esc(t.detail)})</span>`:""}</div>${t.source?`<div style="font-size:10px;color:var(--fit-text-faint);margin-top:3px">SOURCES ▸ ${esc(t.source)}</div>`:""}</div></div>`).join("")||`<div style="color:var(--fit-text-faint);font-size:12px">—</div>`;
  const flags=S.flags.map(f=>{const col=f.urgency==="URGENT"?"var(--fit-alert)":"var(--fit-scanning)";
    return `<div style="border:1px solid var(--fit-border);border-left:2px solid ${col};background:var(--fit-surface-2);padding:10px 12px">

function graphSvg(){
  const nodes=S.summary.entities.slice(0,8);
  if(!nodes.length) return `<div style="color:var(--fit-text-faint);font-size:12px">—</div>`;
  const cx=160,cy=120,R=90; const pos={};
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;pos[n]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};});
  const edges=S.relationships.filter(([a,b])=>pos[a]&&pos[b]).map(([a,b])=>{const hot=S.filterEnt&&(S.filterEnt===a||S.filterEnt===b);
    return `<line x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" stroke="var(--fit-sage)" stroke-width="1" stroke-dasharray="3,3" opacity="${hot?0.9:0.4}"></line>`;}).join("");
  const circ=nodes.map(n=>{const foc=S.filterEnt===n;const short=n.length>8?n.slice(0,7)+"…":n;
    return `<g onclick="fitini.focus('${esc(n)}')" style="cursor:pointer"><circle cx="${pos[n].x}" cy="${pos[n].y}" r="${foc?18:14}" fill="var(--fit-surface-3)" stroke="var(--fit-green)" stroke-width="${foc?2.4:1.3}"></circle><text x="${pos[n].x}" y="${pos[n].y+3}" text-anchor="middle" font-size="8" font-family="var(--mono)" fill="var(--fit-green)">${esc(short)}</text></g>`;}).join("");
  return `<svg viewBox="0 0 320 240" style="width:100%;height:auto;display:block">${edges}${circ}</svg>`;
}

/* ================= FLUX / WS ================= */
function startFlux(){
  resetFlux(); S.started=true; S.streaming=true;
  renderFluxCta(); renderAnalyzer();
  const proto=location.protocol==="https:"?"wss:":"ws:";
  const dom=[...S.domains].join(",");
  ws=new WebSocket(`${proto}//${location.host}/ws/intercept?token=${encodeURIComponent(S.token||"")}&domains=${encodeURIComponent(dom)}`);
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==="utterance") onUtterance(m);
    else if(m.type==="complete"){ onComplete(m); }
    else if(m.type==="error"){ S.streaming=false; renderAnalyzer(); }
  };
  ws.onclose=()=>{ S.streaming=false; if(S.screen==="intercept"){renderFluxCta();renderAnalyzer();} };
  ws.onerror=()=>{ S.streaming=false; };
}
function resetFlux(){
  if(ws){try{ws.close();}catch(e){}ws=null;}
  S.started=S.done=S.streaming=false; S.lines=[]; S.frames=[]; S.detectedOrder=[];
  S.rows=emptyRows(); S.cellOf={}; S.pairOf={}; S.hotCanon=null; S.arrow=null; S.flagQueue=[]; S.busyFlags=false;
  S.summary={locked:null,leading:null,entities:[]}; S.relationships=[]; S.hypotheses=[]; S.timeline=[]; S.flags=[];
}
function onUtterance(m){
  S.frames.push(m);
  const line={ts:m.ts,speaker:m.speaker,segs:m.segs||[]};
  S.lines.push(line);
  // accumulate canonical state
  S.summary=m.summary||S.summary; S.relationships=m.relationships||S.relationships;
  S.hypotheses=m.hypotheses||S.hypotheses; S.timeline=m.timeline||S.timeline;
  (m.alerts||[]).forEach(a=>S.flags.push({name:a.name,message:a.message,urgency:a.urgency,value:a.value}));
  (m.new_entities||[]).forEach(e=>{if(!S.detectedOrder.includes(e))S.detectedOrder.push(e);});
  buildMatrix();
  if(S.screen==="intercept"){ renderTranscript(); renderMatrix(); renderSummary(); }
  // flagged words -> sequential arrows
  const alertVals=new Set((m.alerts||[]).map(a=>a.value).filter(Boolean));
  const flagged=(m.segs||[]).filter(s=>s.label&&s.canonical&&(FLAG_LABELS.has((s.label||"").toUpperCase())||alertVals.has(s.canonical))).map(s=>s.canonical);
  const uniq=[...new Set(flagged)];
  if(uniq.length&&S.screen==="intercept"){ S.flagQueue.push(...uniq); pumpFlags(); }
}
function onComplete(m){
  S.done=true; S.streaming=false;
  if(m.report){ S.summary=m.report.summary||S.summary; S.relationships=m.report.relationships||S.relationships; S.timeline=m.report.timeline||S.timeline; }
  if(S.screen==="intercept"){ renderFluxCta(); renderAnalyzer(); }
}
function buildMatrix(){
  const rows=emptyRows(); const cell={}; const pair={};
  S.relationships.forEach(([a,b])=>{ if(!pair[a]&&a!==b) pair[a]=b; });
  let r=0; const placed=new Set();
  for(const canon of S.detectedOrder){
    if(r>=6) break;
    if(placed.has(canon)) continue;
    rows[r][0]=canon; cell[canon]=[r,0]; placed.add(canon);
    const p=pair[canon];
    if(p&&!placed.has(p)){ rows[r][1]=p; cell[p]=[r,1]; placed.add(p); }
    r++;
  }
  S.rows=rows; S.cellOf=cell;
}

/* ---- sequential flag arrows (one at a time) ---- */
function pumpFlags(){
  if(S.busyFlags) return;
  if(!S.flagQueue.length){ return; }
  const canon=S.flagQueue.shift(); S.busyFlags=true;
  setHot(canon);
  drawArrow(canon,()=>{ S.busyFlags=false; setTimeout(pumpFlags,120); });
}
function setHot(canon){
  S.hotCanon=canon;
  document.querySelectorAll(".cell-hot").forEach(el=>el.classList.remove("cell-hot"));
  const cc=S.cellOf[canon]; const cell=cc&&$("cell-"+cc[0]+"-"+cc[1]); if(cell)cell.classList.add("cell-hot");
}
function drawArrow(canon,done){
  requestAnimationFrame(()=>{
    const root=$("ingest"),layer=$("arrow-layer"); if(!root||!layer){done&&done();return;}
    const spans=root.querySelectorAll('[data-ent="'+canon.replace(/"/g,"")+'"]');
    const src=spans[spans.length-1]; const cc=S.cellOf[canon]; const cell=cc&&$("cell-"+cc[0]+"-"+cc[1]);
    if(src)src.classList.add("kw-flash");
    if(!src||!cell){ done&&done(); return; }
    const rb=root.getBoundingClientRect(),s=src.getBoundingClientRect(),c=cell.getBoundingClientRect();
    const x1=s.right-rb.left,y1=s.top-rb.top+s.height/2,x2=c.left-rb.left,y2=c.top-rb.top+c.height/2;
    layer.innerHTML=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--fit-sage)"/></marker></defs>
      <path d="M${x1},${y1} L${x2},${y2}" stroke="var(--fit-sage)" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#ah)" opacity="0" style="animation:fit-arrow .22s ease forwards"><animate attributeName="opacity" to="1" dur="0.2s" fill="freeze"/></path>`;
    const path=layer.querySelector("path"); if(path)path.style.opacity="1";
    setTimeout(()=>{ if(path){path.style.transition="opacity .26s";path.style.opacity="0";} setTimeout(()=>{layer.innerHTML="";done&&done();},300); },760);
  });
}

/* ================= actions / terminal ================= */
function addResult(title,body,sources){ S.results=[{id:Date.now()+Math.floor(Math.random()*1e4),title,body,sources},...S.results].slice(0,5); }
function toReportThen(fn){ if(S.screen!=="report"){S.screen="report";render();setTimeout(fn,30);} else {fn();render();} }
function doAction(a){
  switch(a){
    case "chrono": toReportThen(()=>addResult("Chronologie des faits",(S.timeline.filter(e=>e.kind!=="lead").length)+" faits ordonnés.","moteur · flux courant")); break;
    case "graphe": toReportThen(()=>addResult("Graphe de relations",S.summary.entities.length+" entités · "+S.relationships.length+" liens.","moteur · corrélation")); break;
    case "flags": toReportThen(()=>addResult("Anomalies",S.flags.length+" flag(s) détecté(s).","moteur · règles d'alerte")); break;
    case "cross": S.crossOpen=true; render(); break;
    case "filter": S.filterEnt=S.filterEnt?null:(S.summary.locked?"AMIRI":S.summary.entities[0]||null); render(); break;
  }
}
function doCross(a,b){ toReportThen(()=>addResult("Croisement "+a+" × "+b, crossCount(a,b)+" passage(s) commun(s).","flux courant")); }
function crossCount(a,b){ let n=0; S.frames.forEach(f=>{const ks=(f.segs||[]).filter(s=>s.canonical).map(s=>s.canonical);if(ks.includes(a)&&ks.includes(b))n++;}); return n; }
function findCount(w){ let n=0; S.frames.forEach(f=>{(f.segs||[]).forEach(s=>{if((s.text||"").toLowerCase().includes(w.toLowerCase()))n++;});}); return n; }
function linkList(key){ return S.relationships.filter(l=>l.includes(key)).map(l=>l.join("↔")); }

function termPrint(t,c){ S.termLines.push({t,c:c||"var(--fit-text-dim)"}); const o=$("term-out"); if(o){o.innerHTML=S.termLines.map(l=>`<div style="color:${l.c};white-space:pre-wrap">${esc(l.t)}</div>`).join("");o.scrollTop=o.scrollHeight;} }
function termExec(raw){
  termPrint("▸ "+raw,"var(--fit-green)");
  const parts=raw.split(/\s+/); const cmd=(parts[0]||"").toLowerCase(); const rest=parts.slice(1); const arg=rest.join(" ");
  switch(cmd){
    case "help": CMDS.forEach(c=>termPrint("  "+c.cmd.padEnd(16," ")+c.desc,"var(--fit-text-muted)")); break;
    case "clear": S.termLines=[]; termPrint("",""); break;
    case "chrono": doAction("chrono"); S.timeline.filter(e=>e.kind!=="lead").slice(0,12).forEach(t=>termPrint("  "+(t.t||"")+"  "+t.text)); break;
    case "graphe": case "graph": doAction("graphe"); termPrint("  "+S.summary.entities.length+" entités · "+S.relationships.length+" liens"); break;
    case "flags": case "flag": doAction("flags"); S.flags.forEach(f=>termPrint("  ["+(f.urgency||"")+"] "+f.name+(f.value?" "+f.value:"")+" — "+(f.message||""))); break;
    case "cross": if(rest.length<2){termPrint("  usage : cross A B","var(--fit-alert)");break;} {const a=rest[0].toUpperCase(),b=rest.slice(1).join(" ").toUpperCase(); doCross(a,b); termPrint("  "+a+" × "+b+" — "+crossCount(a,b)+" commun(s)");} break;
    case "link": if(!arg){termPrint("  usage : link <entité>","var(--fit-alert)");break;} {const k=arg.toUpperCase(); S.filterEnt=k; if(S.screen==="report")render(); const ls=linkList(k); termPrint("  relations : "+(ls.length?ls.join("  "):"aucune"));} break;
    case "find": if(!arg){termPrint("  usage : find <mot>","var(--fit-alert)");break;} termPrint("  « "+arg+" » — "+findCount(arg)+" occurrence(s)"); break;
    default: termPrint("  commande inconnue : "+cmd+"  (help)","var(--fit-alert)");
  }
}

/* ================= handlers ================= */
window.fitini={
  toggleDomain:(id)=>{ S.domains.has(id)?S.domains.delete(id):S.domains.add(id); render(); },
  enter:()=>{ if(!S.domains.size)return; S.screen="intercept"; render(); },
  go:(k)=>{ S.screen=k; render(); if(k==="archive")loadArchive(); },
  lock:()=>{ S.screen="selection"; render(); },
  startFlux, focus:(c)=>{ S.filterEnt=S.filterEnt===c?null:c; if(S.screen==="report")render(); else {renderTranscript();renderMatrix();} },
  action:doAction,
  dropResult:(id)=>{ S.results=S.results.filter(r=>r.id!==id); render(); },
  toggleTerm:()=>{ S.termOpen=!S.termOpen; render(); if(S.termOpen)setTimeout(()=>{const i=$("term-in");if(i)i.focus();},40); },
  termKey:(e)=>{ if(e.key!=="Enter")return; const v=e.target.value.trim(); if(!v)return; e.target.value=""; termExec(v); },
  closeCross:()=>{ S.crossOpen=false; render(); },
  runCross:()=>{ const a=$("crossA").value,b=$("crossB").value; S.crossOpen=false; render(); doCross(a,b); },
  setQuery:(v)=>{ S.query=v; const app=$("app"); /* light re-render of archive only */ render(); },
  toggleSetting:(k)=>{ S.settings[k]=!S.settings[k]; render(); saveSettings(); },
  upload:(file)=>uploadFile(file),
};

async function loadArchive(){ try{const r=await api("/api/sessions");S.archive=r.sessions||[];if(S.screen==="archive")render();}catch(e){} }
async function saveSettings(){ try{await api("/api/settings",{method:"PUT",json:{settings:S.settings}});}catch(e){} }
async function uploadFile(file){
  const st=$("analyze-status"); if(!file){return;}
  if(st)st.textContent="Analyse en cours…";
  try{
    const fd=new FormData(); fd.append("file",file);
    const h={}; if(S.token)h["Authorization"]="Bearer "+S.token;
    const dom=[...S.domains].join(",");
    const r=await fetch("/api/analyze?domains="+encodeURIComponent(dom),{method:"POST",headers:h,body:fd});
    const j=await r.json();
    if(j.report){ S.summary=j.report.summary; S.relationships=j.report.relationships||[]; S.timeline=j.report.timeline||[]; S.flags=j.report.alerts||[]; S.lines=[]; }
    if(st)st.textContent="Analyse terminée — "+(j.lines||0)+" lignes. Voir REPORT.";
  }catch(e){ if(st)st.textContent="Échec de l'analyse."; }
}

/* ================= boot ================= */
async function boot(){
  // ensure a token (demo auth)
  if(!S.token){
    try{ const r=await api("/api/login",{method:"POST",json:{operator_id:"OP-7781",passphrase:"fitini"}});
      S.token=r.token; localStorage.setItem("fitini_tok",S.token); }catch(e){}
  }
  try{ const d=await api("/api/domains"); if(d&&d.domains&&d.domains.length){ DOMAINS.length=0; d.domains.forEach(x=>DOMAINS.push(x)); } }catch(e){}
  render();
}
boot();
</script>
