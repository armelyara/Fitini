<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitini — Poste d'analyse</title>
<style>
:root{
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fit-green:#38ef7d; --fit-green-solid:#5cff98; --fit-green-dim:#1f7a46; --fit-green-glow:rgba(56,239,125,.22);
  --fit-ink-on-green:#07140c; --fit-sage:#78a890; --fit-scanning:#d8b24a; --fit-alert:#e2574f;
  --fit-bg:#0b0d0d; --fit-surface:#111516; --fit-surface-2:#151a1b; --fit-surface-3:#0e1213;
  --fit-titlebar:#141a1b; --fit-border:#242b2c; --fit-border-strong:#394244; --fit-grid-line:#1b2122;
  --fit-text:#d6e2df; --fit-text-dim:#aebbb8; --fit-text-muted:#7d8c89; --fit-text-faint:#55615f;
  --cat-person:#38ef7d; --cat-place:#78a890; --cat-org:#d8b24a; --cat-threat:#e2574f; --cat-date:#5fcede; --cat-asset:#bfa6ea;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fit-bg);color:var(--fit-text);font-family:var(--mono);-webkit-font-smoothing:antialiased}
#app{height:100%}
button{font-family:var(--mono);cursor:pointer}
input,select{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#111314}::-webkit-scrollbar-thumb{background:#2c3233}::-webkit-scrollbar-thumb:hover{background:#3a4243}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 3px)}
@keyframes fit-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fit-stream{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fit-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fit-flash{0%{box-shadow:0 0 0 rgba(56,239,125,0)}35%{box-shadow:0 0 18px var(--fit-green-glow)}100%{box-shadow:0 0 6px var(--fit-green-glow)}}
@keyframes fit-dash{to{stroke-dashoffset:-18}}
@keyframes fit-arrow-in{from{opacity:0}to{opacity:1}}
.dmrow{transition:transform .14s var(--ease),background .14s}
.dmrow:hover{transform:translateX(7px);background:rgba(56,239,125,.07)}
.kw-flash{animation:fit-flash .5s ease-out}
.cell-hot{box-shadow:0 0 14px var(--fit-green-glow)!important;border-color:var(--fit-green)!important}
.ent{border-bottom:2px solid currentColor;padding:0 1px;font-weight:700;cursor:pointer;transition:opacity .15s}
.ent.dim{opacity:.28}
.win{border:1px solid var(--fit-border);background:var(--fit-surface)}
.win>.hd{display:flex;justify-content:space-between;align-items:center;background:var(--fit-titlebar);border-bottom:1px solid var(--fit-border);padding:7px 12px;font-size:12px}
.win>.rule{height:2px;background:linear-gradient(90deg,var(--fit-green),transparent)}
.win>.hd .wc{letter-spacing:3px;color:var(--fit-text-faint);user-select:none}
.win>.hd .wc b{cursor:pointer;padding:0 3px;font-weight:400}
.win>.hd .wc b:hover{color:var(--fit-green)}
.win.collapsed>:not(.hd){display:none!important}
.win.maximized{position:fixed;inset:70px 16px 16px 16px;z-index:200;overflow:auto;max-width:none!important}
.wc{color:var(--fit-text-faint);letter-spacing:.2em;font-size:11px}
.primary{font-size:12px;letter-spacing:.14em;color:var(--fit-ink-on-green);background:var(--fit-green);border:none;padding:11px 20px;box-shadow:0 0 10px var(--fit-green-glow)}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 18px;border:none;border-left:2px solid transparent;background:transparent;color:var(--fit-text);font-size:12px;letter-spacing:.14em}
.navbtn.on{border-left-color:var(--fit-green);background:rgba(56,239,125,.07);color:var(--fit-green);text-shadow:0 0 8px var(--fit-green-glow)}
.actbtn{font-size:11px;letter-spacing:.1em;color:var(--fit-text);background:var(--fit-surface);border:1px solid var(--fit-border);padding:9px 14px}
.actbtn:hover{border-color:var(--fit-green-dim);color:var(--fit-green)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL_CAT={PERSON:"person",SUBJECT:"person",ALIAS:"person",GENE:"person",HANDLE:"person",SYMPTOM:"person",LOCATION:"place",PLACE:"place",COORD:"place",ANATOMY:"place",
  ORG:"org",SECTOR:"org",IP:"org",IBAN:"org",MONEY:"org",MUTATION:"org",HISTORY:"org",CODEWORD:"threat",ACTOR:"threat",THREAT:"threat",CVE:"threat",APT:"threat",MALWARE:"threat",ADR:"threat",FLAG:"threat",HATE:"threat",LANDGRAB:"threat",VIOLENCE:"threat",ADVERSE_EFFECT:"threat",
  DEADLINE:"date",PHONE:"date",DATE:"date",EMAIL:"date",URL:"date",DISINFO:"date",DURATION:"date",ASSET:"asset",DRUG:"asset",WATCH:"asset"};
const FLAG_LABELS=new Set(["CODEWORD","ASSET","DEADLINE","COORD","PHONE","CVE","APT","MALWARE","ADR"]);
const catOf=(l)=>LABEL_CAT[(l||"").toUpperCase()]||"org";
const catColor=(c)=>`var(--cat-${c})`;

let DOMAINS=[
  {id:"justice",name:"Justice / e-Discovery",desc:"Pièces, correspondances, dépositions."},
  {id:"osint",name:"Réseaux sociaux (OSINT)",desc:"Comptes, pseudonymes, lieux, résolution d'alias."},
  {id:"cti",name:"Cybersécurité (CTI)",desc:"Acteurs, IOC, infrastructures, campagnes."},
  {id:"pharma",name:"Biomédical / Pharmacovigilance",desc:"Substances, effets indésirables, signaux."},
];
const CMDS=[
  {cmd:"chrono",desc:"chronologie des faits"},{cmd:"graphe",desc:"graphe de relations"},
  {cmd:"flags",desc:"anomalies détectées"},{cmd:"cross A B",desc:"croiser deux entités"},
  {cmd:"link <entité>",desc:"relations d'une entité"},{cmd:"find <mot>",desc:"recherche plein-texte"},
  {cmd:"help · clear",desc:"guide · effacer"},
];
const NAV=[["intercept","01 INTERCEPT"],["analyze","02 ANALYSE"],["report","03 REPORT"],["dossier","04 DOSSIER"],["archive","05 ARCHIVE"],["config","06 CONFIG"]];

const S={
  screen:"intercept", token:localStorage.getItem("fitini_tok")||null, opId:"OPÉRATEUR", clock:"--:--:-- UTC",
  domain:"justice", domainsOpen:false, subject:"", interceptSource:"", micMode:false,
  started:false, done:false, streaming:false,
  lines:[], frames:[], detectedOrder:[], rows:emptyRows(), cellOf:{}, hotCanon:null,
  summary:{locked:null,leading:null,entities:[]}, relationships:[], hypotheses:[], timeline:[], flags:[], locations:[],
  flagQueue:[], busyFlags:false,
  results:[], filterEnt:null, termOpen:false, alert:null, alertedKeys:new Set(),
  termLines:[{t:"Fitini · terminal déterministe — tapez `help`.",c:"var(--fit-sage)"}],
  crossOpen:false, query:"", archive:[], settings:{vad:true,diarize:true,redact:false,autolock:true},
  dossiers:[], dossierId:null, dossierData:null, dossierNew:"",
  winMin:new Set(), winMax:null, winClosed:new Set(), micError:null,
  searchQ:"", searchResults:[], searchChecked:new Set(), searchError:null, searchBusy:false,
};
let ws=null;
function emptyRows(){return [];}

/* ---------------- api ---------------- */
async function relogin(){
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({operator_id:"ANALYSTE",passphrase:"fitini"})});
  if(!r.ok) throw new Error("login "+r.status);
  const j=await r.json(); S.token=j.token; localStorage.setItem("fitini_tok",S.token); return S.token;
}
async function api(path,opts={},_retried){
  const h=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(S.token) h["Authorization"]="Bearer "+S.token;
  const r=await fetch(path,Object.assign({},opts,{headers:h,body:opts.json?JSON.stringify(opts.json):opts.body}));
  if(r.status===401 && !_retried && path!=="/api/login"){ await relogin(); return api(path,opts,true); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}
setInterval(()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
  S.clock=p(d.getUTCHours())+":"+p(d.getUTCMinutes())+":"+p(d.getUTCSeconds())+" UTC";
  const c=$("clock"); if(c)c.textContent=S.clock;},1000);

/* ================= RENDER ================= */
function win(title,body,extra){
  const key=title;
  if(S.winClosed.has(key)) return "";
  const k=encodeURIComponent(key);
  const cls="win"+(S.winMin.has(key)?" collapsed":"")+(S.winMax===key?" maximized":"");
  return `<div class="${cls}" ${extra||""}><div class="hd"><span>${esc(title)}</span><span class="wc"><b onclick="fitini.winMin('${k}')" title="Réduire">–</b><b onclick="fitini.winMax('${k}')" title="Agrandir">□</b><b onclick="fitini.winClose('${k}')" title="Fermer">×</b></span></div><div class="rule"></div>${body}</div>`;
}
function render(){
  $("app").innerHTML=shell(content());
  if(S.screen==="intercept"){ interceptMount(); }
  if(S.termOpen) setTimeout(()=>{const i=$("term-in");if(i)i.focus();},30);
}
function shell(main){
  const dl=(DOMAINS.find(d=>d.id===S.domain)||DOMAINS[0]).name.split(" ")[0].toUpperCase();
  const nav=NAV.map(([k,l])=>`<button class="navbtn ${S.screen===k?"on":""}" onclick="fitini.go('${k}')">${esc(l)}${(k==="intercept"&&S.started&&!S.done)?'<span style="margin-left:auto;color:var(--fit-green)">●</span>':""}</button>`).join("");
  return `<div style="display:grid;grid-template-rows:auto 1fr;height:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 20px;border-bottom:1px solid var(--fit-border);background:var(--fit-surface-3);flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:18px">
        <span style="font-size:16px;letter-spacing:.34em;color:var(--fit-green);text-shadow:0 0 10px var(--fit-green-glow);font-weight:700">FITINI</span>
        <span style="font-size:10px;letter-spacing:.2em;color:var(--fit-sage)">POSTE D'ANALYSE · RESTRICTED</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span id="clock" style="font-size:11px;color:var(--fit-text-muted);letter-spacing:.1em">${esc(S.clock)}</span>
        <input id="subject-in" value="${esc(S.subject)}" oninput="fitini.setSubject(this.value)" onkeydown="fitini.subjectKey(event)" placeholder="⌖ Sujet / sélecteurs…" title="Qui / quoi tu suis (séparés par des virgules). Entrée pour (re)lancer." style="background:var(--fit-surface-3);border:1px solid var(--fit-border-strong);color:var(--fit-green);font-size:10px;letter-spacing:.06em;padding:6px 10px;outline:none;width:190px"/>
        <div style="position:relative">
          <button onclick="fitini.toggleDomains()" style="font-size:10px;letter-spacing:.12em;color:${S.domainsOpen?"var(--fit-ink-on-green)":"var(--fit-sage)"};background:${S.domainsOpen?"var(--fit-green)":"transparent"};border:1px solid var(--fit-green-dim);padding:6px 10px">⌗ MODE : ${esc(dl)} ▾</button>
          ${S.domainsOpen?domainMenu():""}
        </div>
        <button onclick="fitini.toggleTerm()" style="font-size:10px;letter-spacing:.12em;color:${S.termOpen?"var(--fit-ink-on-green)":"var(--fit-green)"};background:${S.termOpen?"var(--fit-green)":"transparent"};border:1px solid var(--fit-green-dim);padding:6px 10px">▌ TERMINAL</button>
        <button onclick="fitini.lock()" style="font-size:10px;letter-spacing:.12em;color:var(--fit-text-muted);background:transparent;border:1px solid var(--fit-border);padding:6px 10px">⏻ VERROU</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:auto 1fr;min-height:0">
      <nav style="width:208px;border-right:1px solid var(--fit-border);background:var(--fit-surface-3);display:flex;flex-direction:column;padding:16px 0;min-height:0">
        <div style="font-size:10px;letter-spacing:.24em;color:var(--fit-text-faint);padding:0 18px 12px">NAVIGATION</div>
        ${nav}
        <div style="margin-top:auto;padding:14px 18px;border-top:1px solid var(--fit-border);font-size:10px;letter-spacing:.1em;color:var(--fit-text-faint);line-height:1.7">OPÉRATEUR<br><span style="color:var(--fit-sage)">${esc(S.opId)}</span><br>HORS-LIGNE · DÉTERMINISTE</div>
      </nav>
      <main style="min-height:0;min-width:0;overflow:auto;position:relative">${main}</main>
    </div>
    ${S.termOpen?terminalPanel():""}
    ${S.crossOpen?crossModal():""}
    <div id="modal-root"></div>
  </div>`;
}
function domainMenu(){
  const rows=DOMAINS.map(d=>{const on=S.domain===d.id;
    return `<button class="dmrow" onclick="fitini.pickDomain('${d.id}')" style="display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-left:2px solid ${on?"var(--fit-green)":"transparent"};background:${on?"rgba(56,239,125,.08)":"transparent"};color:var(--fit-text)">
      <span style="display:block;font-size:12px;letter-spacing:.06em;font-weight:700;color:${on?"var(--fit-green)":"var(--fit-text)"}">${esc(d.name)}</span><span style="display:block;font-size:10px;color:var(--fit-text-muted);line-height:1.4;margin-top:2px">${esc(d.desc)}</span></button>`;}).join("");
  return `<div style="position:absolute;top:calc(100% + 8px);right:0;z-index:78;width:320px;border:1px solid var(--fit-border-strong);background:var(--fit-surface);box-shadow:0 12px 34px rgba(0,0,0,.55)">
    <div style="background:var(--fit-titlebar);border-bottom:1px solid var(--fit-border);padding:8px 12px;font-size:11px;letter-spacing:.14em;color:var(--fit-text)">DOMAINES D'INVESTIGATION</div>
    <div style="height:2px;background:linear-gradient(90deg,var(--fit-green),transparent)"></div>
    <div style="padding:8px">${rows}
      <button class="dmrow" onclick="fitini.openCross()" style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:none;border-left:2px solid transparent;border-top:1px solid var(--fit-grid-line);margin-top:4px;background:transparent;color:var(--fit-sage)">
        <span style="flex:none;font-size:15px;width:14px;text-align:center">⤫</span>
        <span><span style="display:block;font-size:12px;letter-spacing:.06em;font-weight:700">Croisement de sources</span><span style="display:block;font-size:10px;color:var(--fit-text-muted);line-height:1.4;margin-top:2px">Rapprocher deux entités / fichiers.</span></span></button>
    </div></div>`;
}
function content(){
  switch(S.screen){
    case "intercept": return viewIntercept();
    case "report": return viewReport();
    case "dossier": return viewDossier();
    case "archive": return viewArchive();
    case "analyze": return viewAnalyze();
    case "config": return viewConfig();
    default: return "";
  }
}

/* ---- INTERCEPT ---- */
function viewIntercept(){
  const matrix=`<div id="matrix" style="display:grid;grid-template-columns:1fr 1fr;max-height:300px;overflow:auto"></div>`;
  const summary=`<div id="summary" style="padding:14px 16px"></div>`;
  const analyzer=`<div id="analyzer" style="padding:13px 16px;display:flex;flex-direction:column;gap:10px"></div>`;
  return `<div id="ingest" style="position:relative;min-height:100%;padding:22px 28px">
    <svg id="arrow-layer" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:visible"></svg>
    <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:0">
      <div style="padding-right:28px;border-right:1px solid var(--fit-border);display:flex;flex-direction:column;gap:11px;min-height:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;letter-spacing:.2em;color:var(--fit-sage)">TRANSCRIPTION EN DIRECT</span>
          <span id="lc" style="font-size:10px;color:var(--fit-text-faint)"></span>
        </div>
        <div id="transcript" style="display:flex;flex-direction:column;gap:11px"></div>
        <div id="flux-cta"></div>
      </div>
      <div style="padding-left:24px;display:flex;flex-direction:column;gap:16px">
        ${win("Matrice de corrélation",matrix)}
        ${win("Summary",summary)}
        ${win("Analyseur",analyzer)}
      </div>
    </div></div>`;
}
function interceptMount(){ renderMatrix();renderSummary();renderAnalyzer();renderTranscript();renderFluxCta(); }
function maybeAutostart(){ if(!S.started&&!S.done) startFlux(); }
function renderFluxCta(){ const el=$("flux-cta"); if(!el)return;
  if(!S.started) el.innerHTML=`<div style="margin:24px auto;text-align:center">
    <div style="font-size:10px;letter-spacing:.28em;color:var(--fit-sage);margin-bottom:14px">ÉCOUTE D'UNE CONVERSATION EN DIRECT</div>
    <button class="primary" onclick="fitini.listen()">▶ ÉCOUTER (micro)</button>
    ${S.micError?`<div style="font-size:11px;color:#d8b24a;margin-top:12px;max-width:430px;margin-left:auto;margin-right:auto;line-height:1.5">${esc(S.micError)}</div>`:""}
    <div id="int-up" style="font-size:11px;color:var(--fit-text-muted);margin-top:12px;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.5">L'analyse démarre automatiquement dès l'écoute. Pour un fichier / enregistrement, utilise <b style="color:var(--fit-sage)">ANALYSE</b>.</div></div>`;
  else if(S.streaming) el.innerHTML=`<div style="text-align:center;margin:18px auto"><div style="color:var(--fit-sage);font-size:15px;margin-bottom:12px">▌<span style="animation:fit-blink 1s infinite"> écoute…</span></div><button class="actbtn" onclick="fitini.stopFlux()">■ ARRÊTER L'ÉCOUTE</button></div>`;
  else el.innerHTML="";
}
function renderTranscript(){ const el=$("transcript"); if(!el)return;
  el.innerHTML=S.lines.map(lineHtml).join("");
  const lc=$("lc"); if(lc)lc.textContent=S.lines.length+(S.totalLines?("/"+S.totalLines):"");
  el.scrollTop=el.scrollHeight;
}
function lineHtml(ln){
  const spkColor=ln.speaker==="S1"?"var(--cat-person)":"var(--fit-sage)";
  const segs=ln.segs.map(s=>{ if(!s.label) return `<span>${esc(s.text)}</span>`;
    const dim=S.filterEnt&&S.filterEnt!==s.canonical?" dim":"";
    return `<span class="ent${dim}" data-ent="${esc(s.canonical||"")}" onclick="fitini.focus('${esc(s.canonical||"")}')" style="color:${catColor(catOf(s.label))}">${esc(s.text)}</span>`;}).join("");
  return `<div style="animation:fit-stream .3s var(--ease);display:grid;grid-template-columns:62px 42px 1fr;gap:10px;align-items:baseline">
    <span style="color:var(--fit-text-faint);font-size:11px">${esc(ln.ts||"")}</span>
    <span style="font-size:11px;letter-spacing:.06em;color:${spkColor}">${esc(ln.speaker||"")}</span>
    <div style="font-size:15px;line-height:1.5;color:var(--fit-text-dim)">${segs}</div></div>`;
}
function renderMatrix(){ const el=$("matrix"); if(!el)return; let h=""; const n=Math.max(S.rows.length,1);
  for(let r=0;r<n;r++)for(let c=0;c<2;c++){ const v=(S.rows[r]||["",""])[c]; const hot=c===0&&v&&v===S.hotCanon;
    h+=`<div id="cell-${r}-${c}" class="${hot?"cell-hot":""}" style="border:1px solid var(--fit-grid-line);min-height:40px;display:flex;align-items:center;padding:0 12px;font-size:12px;letter-spacing:.05em;color:${v?"var(--fit-green)":"var(--fit-text-faint)"}">${esc(v||"—")}</div>`;}
  el.innerHTML=h;
}
function renderSummary(){ const el=$("summary"); if(!el)return;
  const subj=S.summary.entities[0]||"—";
  const loc=S.locations.length>=2?"Locked":S.locations.length?"Partial":"Scanning";
  const idc=S.summary.locked?"Confirmed":"Pending";
  const g=(k,v,col)=>`<div><div style="color:var(--fit-text-muted);font-size:11px">${k}</div><div style="color:${col||"var(--fit-text)"};font-weight:700;letter-spacing:.04em;margin-top:3px">${esc(v)}</div></div>`;
  const chips=S.locations.map(l=>`<span style="font-size:11px;letter-spacing:.06em;padding:5px 11px;border:1px solid var(--fit-green-dim);color:var(--fit-green)">${esc(l)}</span>`).join("")||`<span style="font-size:11px;color:var(--fit-text-faint)">—</span>`;
  el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
    ${g("Subject:",subj,S.summary.locked?"var(--fit-green)":"var(--fit-text-muted)")}${g("Algorithm:","Key words")}
    ${g("Location:",loc,S.locations.length>=2?"var(--fit-green)":"var(--fit-text-muted)")}${g("ID:",idc,S.summary.locked?"var(--fit-green)":"var(--fit-text-muted)")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${chips}</div>`;
}
function renderAnalyzer(){ const el=$("analyzer"); if(!el)return;
  const col=S.done?"var(--fit-green)":S.started?"var(--fit-scanning)":"var(--fit-text-muted)";
  const lab=S.done?"INTERCEPT COMPLETE":S.started?"STREAM ACTIVE":"IDLE";
  const right=S.done?`<button class="actbtn" onclick="fitini.go('report')">REPORT →</button>`:S.streaming?`<span style="font-size:10px;color:var(--fit-scanning);animation:fit-pulse 1.4s infinite">● REC</span>`:"";
  const row1=`<div style="display:flex;justify-content:space-between;align-items:center"><span style="display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:${col}"><span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${lab}</span>${right}</div>`;
  const row2=S.done?`<button class="actbtn" style="align-self:flex-start" onclick="fitini.startFlux()">↻ REPLAY</button>`:"";
  el.innerHTML=row1+row2;
}

/* ---- deterministic brief (no LLM, source-traced) ---- */
function buildBrief(){
  const L=[]; const dom=(S.domain||"").toUpperCase();
  const ents=S.summary.entities||[], rels=S.relationships||[], flags=S.flags||[], hyps=S.hypotheses||[];
  const tl=(S.timeline||[]).filter(e=>e.kind!=="lead");
  L.push("RAPPORT DE SYNTHÈSE — FITINI  (déterministe · tracé aux sources)");
  L.push("Domaine(s) : "+dom+"   ·   Généré : "+new Date().toLocaleString());
  if(S.subject) L.push("Sujet suivi : "+S.subject);
  L.push("");
  L.push("SYNTHÈSE");
  L.push("- "+ents.length+" entité(s) extraite(s), "+rels.length+" lien(s) de corrélation, "+flags.length+" signal(aux) relevé(s).");
  if(ents.length) L.push("- Entités : "+ents.join(", ")+".");
  if(S.summary.locked) L.push("- Hypothèse verrouillée : "+S.summary.locked+".");
  L.push("");
  if(hyps.length){ L.push("HYPOTHÈSES"); hyps.slice(0,6).forEach(h=>L.push("- "+h.name+"  (confiance "+((h.confidence||0).toFixed(2))+")"+((h.present&&h.present.length)?"  [critères : "+h.present.join(", ")+"]":""))); L.push(""); }
  if(rels.length){ L.push("RÉSEAU DE RELATIONS"); rels.forEach(r=>L.push("- "+r[0]+" — "+r[1])); L.push(""); }
  if(tl.length){ L.push("CHRONOLOGIE DES FAITS"); tl.forEach(e=>L.push("- "+(e.t||"")+"  "+e.text+(e.detail?" ("+e.detail+")":"")+(e.source?"   [source : "+e.source+"]":""))); L.push(""); }
  if(flags.length){ L.push("SIGNAUX / ANOMALIES"); flags.forEach(f=>L.push("- ["+(f.urgency||"")+"] "+f.name+(f.value?" · "+f.value:"")+" — "+(f.message||""))); L.push(""); }
  const src=new Set(); tl.forEach(e=>{if(e.source)src.add(e.source);});
  if(src.size){ L.push("SOURCES"); [...src].forEach(s=>L.push("- "+s)); L.push(""); }
  L.push("— Rapport déterministe : il organise et trace les éléments extraits, il n'émet pas de jugement. Vérifier avant d'agir.");
  return L.join("\n");
}

  const tl=S.timeline.filter(e=>e.kind!=="lead").slice(0,12).map(t=>`<div style="display:grid;grid-template-columns:52px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--fit-grid-line)">

  const flags=S.flags.map(f=>{const col=f.urgency==="URGENT"?"var(--fit-alert)":"var(--fit-scanning)";

      <div style="display:flex;gap:8px;margin-bottom:10px"><button class="actbtn" onclick="fitini.copyBrief()">⧉ Copier</button><button class="actbtn" onclick="fitini.downloadBrief()">⭳ Télécharger .txt</button></div>

        ${win("Graphe de relations",`<div style="padding:12px">${graphSvg()}</div>`)}
        ${win("Chronologie des faits",`<div style="padding:6px 14px 10px">${tl}</div>`)}
        ${win("Flags · anomalies",`<div style="padding:12px;display:flex;flex-direction:column;gap:10px">${flags}</div>`)}
      </div></div></div>`;
}
function graphSvg(){
  const nodes=S.summary.entities.slice(0,24); if(!nodes.length)return `<div style="color:var(--fit-text-faint);font-size:12px">—</div>`;
  const many=nodes.length>12,cx=160,cy=130,R=many?118:90,rad=nodes.length>16?8:(many?10:14),fs=nodes.length>16?6:7,pos={};
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;pos[n]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};});
  const edges=S.relationships.filter(([a,b])=>pos[a]&&pos[b]).map(([a,b])=>{const hot=S.filterEnt&&(S.filterEnt===a||S.filterEnt===b);
    return `<line x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" stroke="var(--fit-sage)" stroke-width="1" stroke-dasharray="3,3" opacity="${hot?.9:.4}"></line>`;}).join("");
  const circ=nodes.map(n=>{const foc=S.filterEnt===n;const sh=n.length>8?n.slice(0,7)+"…":n;
    return `<g onclick="fitini.focus('${esc(n)}')" style="cursor:pointer"><circle cx="${pos[n].x}" cy="${pos[n].y}" r="${foc?rad+4:rad}" fill="var(--fit-surface-3)" stroke="var(--fit-green)" stroke-width="${foc?2.4:1.3}"></circle><text x="${pos[n].x}" y="${pos[n].y+3}" text-anchor="middle" font-size="${fs}" fill="var(--fit-green)">${esc(sh)}</text></g>`;}).join("");
  return `<svg viewBox="0 0 320 270" style="width:100%;height:auto;display:block">${edges}${circ}</svg>`;
}

    <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <select id="crossA" style="background:var(--fit-surface-3);border:1px solid var(--fit-border);color:var(--fit-green);padding:8px">${opts}</select>
      <select id="crossB" style="background:var(--fit-surface-3);border:1px solid var(--fit-border);color:var(--fit-green);padding:8px">${opts}</select>
      <button class="primary" onclick="fitini.runCross()">CROISER →</button></div></div></div>`;}
function alertModal(a){
  const subj=S.summary.locked||(S.summary.entities[0]||"");
  return `<div onclick="fitini.closeAlert()" style="position:fixed;inset:0;z-index:98;background:rgba(12,2,2,.55);display:flex;align-items:center;justify-content:center">
    <div onclick="event.stopPropagation()" style="width:430px;border:1px solid var(--fit-alert);background:var(--fit-surface);box-shadow:0 0 40px rgba(226,87,79,.3)">
      <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(226,87,79,.12);border-bottom:1px solid var(--fit-alert);padding:10px 14px;font-size:12px;letter-spacing:.14em;color:var(--fit-alert)"><span>⚠ ALERTE — ${esc(a.urgency||"MENACE")}</span><span class="wc">- □ x</span></div>
      <div style="padding:18px">
        <div style="font-size:15px;color:var(--fit-alert);font-weight:700;letter-spacing:.06em;margin-bottom:10px">${esc(a.name||"ALERTE")}${a.value?' · '+esc(a.value):''}</div>
        <div style="font-size:13px;color:var(--fit-text-dim);line-height:1.5;margin-bottom:18px">${esc(a.message||"")}${subj?' Corrélé au sujet <span style="color:var(--fit-green)">'+esc(subj)+'</span>.':''}</div>
        <div style="display:flex;gap:10px;justify-content:flex-end"><button class="actbtn" onclick="fitini.closeAlert()">FERMER</button><button class="primary" onclick="fitini.escalate()">ESCALADER → REPORT</button></div>
      </div></div></div>`;
}
function showAlert(a){ S.alert=a; const m=$("modal-root"); if(m)m.innerHTML=alertModal(a); }

/* ================= FLUX / WS ================= */
function startFlux(){
  resetFlux(); S.micError=null; S.started=true; S.streaming=true; renderFluxCta(); renderAnalyzer();
  const proto=location.protocol==="https:"?"wss:":"ws:";
  ws=new WebSocket(`${proto}//${location.host}/ws/intercept?token=${encodeURIComponent(S.token||"")}&domains=${encodeURIComponent(S.domain)}&subject=${encodeURIComponent(S.subject||"")}&source=${encodeURIComponent(S.interceptSource||"")}&mic=${S.micMode?"1":"0"}`);
  ws.onopen=()=>{S._reauthed=false;};
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==="utterance")onUtterance(m); else if(m.type==="complete")onComplete(m);
    else if(m.type==="error"){S.micError="Erreur : "+(m.detail||"source illisible")+" — pour l'écoute micro, installer faster-whisper + sounddevice côté serveur.";S.streaming=false;S.started=false;render();}};
  ws.onclose=(ev)=>{S.streaming=false;
    if(ev&&ev.code===4401&&!S._reauthed){S._reauthed=true;relogin().then(()=>startFlux()).catch(()=>{});return;}
    if(S.screen==="intercept"){renderFluxCta();renderAnalyzer();}};
  ws.onerror=()=>{S.streaming=false;};
}
function resetFlux(){ if(ws){try{ws.close();}catch(e){}ws=null;}
  S.started=S.done=S.streaming=false;S.lines=[];S.frames=[];S.detectedOrder=[];S.rows=emptyRows();S.cellOf={};S.hotCanon=null;
  S.flagQueue=[];S.busyFlags=false;S.summary={locked:null,leading:null,entities:[]};S.relationships=[];S.hypotheses=[];S.timeline=[];S.flags=[];S.locations=[];
  S.alert=null;S.alertedKeys=new Set();const _m=$("modal-root");if(_m)_m.innerHTML="";}
function onUtterance(m){
  S.frames.push(m); S.lines.push({ts:m.ts,speaker:m.speaker,segs:m.segs||[]});
  S.summary=m.summary||S.summary; S.relationships=m.relationships||S.relationships; S.hypotheses=m.hypotheses||S.hypotheses; S.timeline=m.timeline||S.timeline;
  (m.alerts||[]).forEach(a=>S.flags.push({name:a.name,message:a.message,urgency:a.urgency,value:a.value}));
  (m.new_entities||[]).forEach(e=>{if(!S.detectedOrder.includes(e))S.detectedOrder.push(e);});
  (m.segs||[]).forEach(s=>{const u=(s.label||"").toUpperCase(); if((u==="LOCATION"||u==="PLACE"||u==="COORD")&&s.canonical&&!S.locations.includes(s.canonical))S.locations.push(s.canonical);});
  buildMatrix();
  if(S.screen==="intercept"){renderTranscript();renderMatrix();renderSummary();}
  const av=new Set((m.alerts||[]).map(a=>a.value).filter(Boolean));
  // The ENGINE decides which words fired a rule / newly satisfied a hypothesis criterion
  // this frame (m.flag_canonicals). Only those draw an arrow -> logic, not decoration.
  // Fallback heuristic only if the server did not send the field.
  const flagged=(Array.isArray(m.flag_canonicals)
    ? m.flag_canonicals
    : [...new Set((m.segs||[]).filter(s=>s.label&&s.canonical&&(FLAG_LABELS.has((s.label||"").toUpperCase())||av.has(s.canonical))).map(s=>s.canonical))]
  ).filter(c=>S.cellOf[c]);
  if(flagged.length&&S.screen==="intercept"){S.flagQueue.push(...flagged);pumpFlags();}
  // raise the threat modal once per distinct urgent alert, after its arrow has played
  const urg=(m.alerts||[]).find(a=>(a.urgency||"").toUpperCase()==="URGENT"&&!S.alertedKeys.has((a.name||"")+"|"+(a.value||"")));
  if(urg){S.alertedKeys.add((urg.name||"")+"|"+(urg.value||""));setTimeout(()=>{if(S.screen==="intercept")showAlert(urg);},900);}
}
function onComplete(m){ S.done=true;S.streaming=false;
  if(m.report){S.summary=m.report.summary||S.summary;S.relationships=m.report.relationships||S.relationships;S.timeline=m.report.timeline||S.timeline;}
  if(S.micMode && !S.lines.length){S.micError="Aucune parole captée. Vérifie le micro / le loopback audio (ex. BlackHole), et que faster-whisper + sounddevice sont installés côté serveur.";S.done=false;S.started=false;}
  if(S.screen==="intercept"){renderFluxCta();renderAnalyzer();}}
function buildMatrix(){ const rows=[],cell={},pair={};
  S.relationships.forEach(([a,b])=>{if(!pair[a]&&a!==b)pair[a]=b;});
  const placed=new Set();
  for(const canon of S.detectedOrder){ if(placed.has(canon))continue;   // dynamic: grows with entities, no cap
    const r=rows.length; rows.push([canon,""]); cell[canon]=[r,0]; placed.add(canon);
    const p=pair[canon]; if(p&&!placed.has(p)){rows[r][1]=p;cell[p]=[r,1];placed.add(p);} }
  S.rows=rows;S.cellOf=cell;}
function pumpFlags(){ if(S.busyFlags)return; if(!S.flagQueue.length)return;
  const canon=S.flagQueue.shift();S.busyFlags=true;setHot(canon);
  drawArrow(canon,()=>{S.busyFlags=false;setTimeout(pumpFlags,120);});}
function setHot(canon){ S.hotCanon=canon;
  document.querySelectorAll(".cell-hot").forEach(el=>el.classList.remove("cell-hot"));
  const cc=S.cellOf[canon],cell=cc&&$("cell-"+cc[0]+"-"+cc[1]); if(cell)cell.classList.add("cell-hot");}
function drawArrow(canon,done){ requestAnimationFrame(()=>{
    const root=$("ingest"),layer=$("arrow-layer"); if(!root||!layer){done&&done();return;}
    const spans=root.querySelectorAll('[data-ent="'+canon.replace(/"/g,"")+'"]');const src=spans[spans.length-1];
    const cc=S.cellOf[canon],cell=cc&&$("cell-"+cc[0]+"-"+cc[1]); if(src)src.classList.add("kw-flash");
    if(!src||!cell){done&&done();return;}
    const rb=root.getBoundingClientRect(),s=src.getBoundingClientRect(),c=cell.getBoundingClientRect();
    const x1=s.right-rb.left,y1=s.top-rb.top+s.height/2,x2=c.left-rb.left,y2=c.top-rb.top+c.height/2;
    layer.innerHTML=`<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--fit-green)"/></marker></defs><path d="M${x1},${y1} L${x2},${y2}" fill="none" stroke="var(--fit-green)" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#ah)" style="filter:drop-shadow(0 0 5px var(--fit-green-glow));animation:fit-arrow-in .18s ease, fit-dash 1s linear infinite"/>`;
    const path=layer.querySelector("path[marker-end]");
    setTimeout(()=>{if(path){path.style.transition="opacity .28s";path.style.opacity="0";}setTimeout(()=>{layer.innerHTML="";done&&done();},320);},820);
  });}

/* ================= actions / terminal ================= */
function addResult(title,body,sources){S.results=[{id:Date.now()+Math.floor(Math.random()*1e4),title,body,sources},...S.results].slice(0,5);}
function toReportThen(fn){ if(S.screen!=="report"){S.screen="report";render();setTimeout(fn,30);} else {fn();render();} }
function doAction(a){ switch(a){
  case "chrono": toReportThen(()=>addResult("Chronologie des faits",S.timeline.filter(e=>e.kind!=="lead").length+" faits ordonnés.","moteur · flux courant"));break;
  case "graphe": toReportThen(()=>addResult("Graphe de relations",S.summary.entities.length+" entités · "+S.relationships.length+" liens.","moteur · corrélation"));break;
  case "flags": toReportThen(()=>addResult("Anomalies",S.flags.length+" flag(s) détecté(s).","moteur · règles d'alerte"));break;
  case "cross": S.crossOpen=true;render();break;
  case "filter": S.filterEnt=S.filterEnt?null:(S.summary.entities[0]||null);render();break; } }
function doCross(a,b){toReportThen(()=>addResult("Croisement "+a+" × "+b,crossCount(a,b)+" passage(s) commun(s).","flux courant"));}
function crossCount(a,b){let n=0;S.frames.forEach(f=>{const ks=(f.segs||[]).filter(s=>s.canonical).map(s=>s.canonical);if(ks.includes(a)&&ks.includes(b))n++;});return n;}
function findCount(w){let n=0;S.frames.forEach(f=>(f.segs||[]).forEach(s=>{if((s.text||"").toLowerCase().includes(w.toLowerCase()))n++;}));return n;}
function linkList(k){return S.relationships.filter(l=>l.includes(k)).map(l=>l.join("↔"));}
function termPrint(t,c){S.termLines.push({t,c:c||"var(--fit-text-dim)"});const o=$("term-out");if(o){o.innerHTML=S.termLines.map(l=>`<div style="color:${l.c};white-space:pre-wrap">${esc(l.t)}</div>`).join("");o.scrollTop=o.scrollHeight;}}
function termExec(raw){ termPrint("▸ "+raw,"var(--fit-green)");
  const parts=raw.split(/\s+/),cmd=(parts[0]||"").toLowerCase(),rest=parts.slice(1),arg=rest.join(" ");
  switch(cmd){
    case "help": CMDS.forEach(c=>termPrint("  "+c.cmd.padEnd(16," ")+c.desc,"var(--fit-text-muted)"));break;
    case "clear": S.termLines=[];termPrint("","");break;
    case "chrono": doAction("chrono");S.timeline.filter(e=>e.kind!=="lead").slice(0,12).forEach(t=>termPrint("  "+(t.t||"")+"  "+t.text));break;
    case "graphe": case "graph": doAction("graphe");termPrint("  "+S.summary.entities.length+" entités · "+S.relationships.length+" liens");break;
    case "flags": case "flag": doAction("flags");S.flags.forEach(f=>termPrint("  ["+(f.urgency||"")+"] "+f.name+(f.value?" "+f.value:"")+" — "+(f.message||"")));break;
    case "cross": if(rest.length<2){termPrint("  usage : cross A B","var(--fit-alert)");break;}{const a=rest[0].toUpperCase(),b=rest.slice(1).join(" ").toUpperCase();doCross(a,b);termPrint("  "+a+" × "+b+" — "+crossCount(a,b)+" commun(s)");}break;
    case "link": if(!arg){termPrint("  usage : link <entité>","var(--fit-alert)");break;}{const k=arg.toUpperCase();S.filterEnt=k;if(S.screen==="report")render();const ls=linkList(k);termPrint("  relations : "+(ls.length?ls.join("  "):"aucune"));}break;
    case "find": if(!arg){termPrint("  usage : find <mot>","var(--fit-alert)");break;}termPrint("  « "+arg+" » — "+findCount(arg)+" occurrence(s)");break;
    default: termPrint("  commande inconnue : "+cmd+"  (help)","var(--fit-alert)");}}

/* ================= handlers ================= */
window.fitini={
  go:(k)=>{S.screen=k;S.domainsOpen=false;S.winMin.clear();S.winMax=null;S.winClosed.clear();if(k==="dossier"){S.dossierId=null;S.dossierData=null;}render();if(k==="archive")loadArchive();if(k==="dossier")loadDossiers();},
  lock:()=>{if(ws){try{ws.close();}catch(e){}} S.screen="intercept";S.domainsOpen=false;resetFlux();render();},
  toggleDomains:()=>{S.domainsOpen=!S.domainsOpen;render();},
  setSubject:(v)=>{S.subject=v;},
  subjectKey:(e)=>{if(e.key==="Enter"&&S.screen==="intercept")startFlux();},
  listen:()=>{S.micMode=true;S.interceptSource="";startFlux();},
  stopFlux:()=>{if(ws){try{ws.close();}catch(e){}} S.streaming=false;S.done=true;S.micMode=false;renderFluxCta();renderAnalyzer();},
  copyBrief:()=>{try{navigator.clipboard.writeText(buildBrief());}catch(e){}},
  downloadBrief:()=>{const b=new Blob([buildBrief()],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="fitini-rapport.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);},
  pickDomain:(id)=>{S.domain=id;S.domainsOpen=false;resetFlux();render();},
  openCross:()=>{S.domainsOpen=false;S.crossOpen=true;render();},
  startFlux,
  focus:(c)=>{S.filterEnt=S.filterEnt===c?null:c;if(S.screen==="report")render();else{renderTranscript();renderMatrix();}},
  action:doAction, dropResult:(id)=>{S.results=S.results.filter(r=>r.id!==id);render();},
  toggleTerm:()=>{S.termOpen=!S.termOpen;render();},
  termKey:(e)=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;e.target.value="";termExec(v);},
  closeCross:()=>{S.crossOpen=false;render();},
  closeAlert:()=>{const m=$("modal-root");if(m)m.innerHTML="";S.alert=null;},
  escalate:()=>{const m=$("modal-root");if(m)m.innerHTML="";S.alert=null;S.screen="report";render();},
  runCross:()=>{const a=$("crossA").value,b=$("crossB").value;S.crossOpen=false;render();doCross(a,b);},
  setQuery:(v)=>{S.query=v;if(S.screen==="archive")render();},
  setDossierNew:(v)=>{S.dossierNew=v;},
  createDossier:async()=>{const n=(S.dossierNew||"").trim();if(!n)return;try{await api("/api/dossiers",{method:"POST",json:{name:n}});S.dossierNew="";await loadDossiers();}catch(e){}},
  openDossier:async(id)=>{S.searchQ="";S.searchResults=[];S.searchChecked=new Set();S.searchError=null;S.searchBusy=false;try{const d=await api("/api/dossier/"+id);S.dossierId=id;S.dossierData=d;render();}catch(e){}},
  closeDossier:()=>{S.dossierId=null;S.dossierData=null;S.searchResults=[];S.searchChecked=new Set();S.searchQ="";render();loadDossiers();},
  winMin:(k)=>{const key=decodeURIComponent(k);if(S.winMin.has(key))S.winMin.delete(key);else S.winMin.add(key);render();},
  winMax:(k)=>{const key=decodeURIComponent(k);S.winMax=(S.winMax===key?null:key);render();},
  winClose:(k)=>{const key=decodeURIComponent(k);S.winClosed.add(key);render();},
  setSearchQ:(v)=>{S.searchQ=v;},
  dossierSearch:async()=>{if(!S.dossierData)return;S.searchBusy=true;S.searchError=null;S.searchResults=[];S.searchChecked=new Set();render();try{const r=await api("/api/search?subject="+encodeURIComponent(S.dossierData.name)+"&query="+encodeURIComponent(S.searchQ||""));S.searchResults=r.candidates||[];S.searchError=r.error||null;}catch(e){S.searchError="Recherche indisponible.";}S.searchBusy=false;render();},
  toggleCheck:(id)=>{if(S.searchChecked.has(id))S.searchChecked.delete(id);else S.searchChecked.add(id);render();},
  collectChecked:async()=>{if(!S.dossierId)return;const sel=(S.searchResults||[]).filter(r=>S.searchChecked.has(r.id));if(!sel.length)return;try{const r=await api("/api/dossier/"+S.dossierId+"/collect",{method:"POST",json:{candidates:sel}});if(r.dossier)S.dossierData=r.dossier;S.searchResults=[];S.searchChecked=new Set();S.searchQ="";render();}catch(e){S.searchError="T\u00e9l\u00e9chargement impossible.";render();}},
  toggleSetting:(k)=>{S.settings[k]=!S.settings[k];render();saveSettings();},
  upload:(f)=>uploadFile(f),
};
async function loadArchive(){try{const r=await api("/api/sessions");S.archive=r.sessions||[];if(S.screen==="archive")render();}catch(e){}}
async function loadDossiers(){try{const r=await api("/api/dossiers");S.dossiers=r.dossiers||[];if(S.screen==="dossier"&&!S.dossierId)render();}catch(e){}}
async function saveSettings(){try{await api("/api/settings",{method:"PUT",json:{settings:S.settings}});}catch(e){}}
async function uploadFile(file){const st=$("analyze-status");if(!file)return;if(st){st.style.color="var(--fit-text-muted)";st.textContent="Analyse en cours…";}
  try{const fd=new FormData();fd.append("file",file);
    const send=()=>{const h={};if(S.token)h["Authorization"]="Bearer "+S.token;
      return fetch("/api/analyze?domains="+encodeURIComponent(S.domain)+"&subject="+encodeURIComponent(S.subject||""),{method:"POST",headers:h,body:fd});};
    let r=await send();
    if(r.status===401){try{await relogin();r=await send();}catch(e){}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){if(st){st.style.color="#e5534b";st.textContent="Échec ("+r.status+") : "+(j.detail||j.error||"erreur serveur");}return;}
    if(j.report){S.summary=j.report.summary;S.relationships=j.report.relationships||[];S.timeline=j.report.timeline||[];S.flags=j.report.alerts||[];S.lines=[];}
    if(j.error){if(st){st.style.color="#e5534b";st.textContent="Extraction impossible : "+j.error;}return;}
    if(st){st.style.color=(j.lines?"var(--fit-text-muted)":"#d8b24a");st.textContent=(j.lines?("Analyse terminée — "+j.lines+" lignes. Voir REPORT."):(j.note||"Aucune ligne analysée."));}
  }catch(e){if(st)st.textContent="Échec de l'analyse.";}}

/* ================= boot ================= */
async function boot(){
  if(!S.token){try{const r=await api("/api/login",{method:"POST",json:{operator_id:"ANALYSTE",passphrase:"fitini"}});S.token=r.token;localStorage.setItem("fitini_tok",S.token);}catch(e){}}
  try{const me=await api("/api/me");if(me&&me.operator_id)S.opId=me.operator_id;}catch(e){}
  try{const d=await api("/api/domains");if(d&&d.domains&&d.domains.length)DOMAINS=d.domains;}catch(e){}
  render();
}
boot();
</script>
